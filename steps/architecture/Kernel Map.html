B["s07"] = {
  what: `A panic is the kernel's deliberate refusal to handle an error. When code proves that its own model of the machine is wrong, every instruction after that point runs on a false premise, so the correct response is to stop and preserve evidence rather than continue. In this kernel panic() is a function that never returns: it disables interrupts, prints a banner, a message, a register dump and a stack backtrace over the serial port, then parks the core in a halt loop forever. KASSERT is a macro that states an invariant and calls panic() when the invariant is false, printing the expression text, file and line. A backtrace is the list of return addresses currently on the stack; this one is produced by walking the frame-pointer chain, which is the linked list the compiler builds when every function starts with push rbp; mov rsp, rbp.`,
  why: `Until Phase 2 there is no IDT, so any fault the CPU raises has nowhere to go: it escalates page fault to double fault to triple fault, the processor signals shutdown, and the platform resets. The machine reboots, the registers are cleared, the screen is cleared, and your bug happens again — silently, forever. In CI that loop is not even a specific answer; it is the same generic TIMEOUT you get for a deadlock. Panic converts a silent reboot loop into a paragraph of text you can read, and KASSERT is what every Tier-2 in-kernel test is written in terms of, so the whole middle tier of the test pyramid cannot exist before this file does.`,
  spec: [
    ["Signature", "[[noreturn]] void panic(const char* fmt, ...) __attribute__((format(printf, 1, 2)))"],
    ["The 8 steps, in order", "cli, banner, message, registers, backtrace, log ring, console sink, cli+hlt loop — each more likely to fault than the one above"],
    ["Frame layout (SysV, frame pointers on)", "rbp+0 = caller's saved rbp; rbp+8 = return address; StackFrame is 16 bytes"],
    ["Frame predicates, all checked BEFORE dereference", "addr >= 0xFFFF800000000000; addr <= UINTPTR_MAX - 16; (addr & 0x7) == 0; next > current"],
    ["Frame bound", "MAX_FRAMES = 32"],
    ["Text range", "__text_start <= ret < __text_end, exported by linker.ld (Stage 0.4)"],
    ["RIP source", "__builtin_return_address(0) — the call site of panic, not a point inside it"],
    ["RFLAGS read", "pushfq; popq — safe only because -mno-red-zone is set"],
    ["Required flag", "-fno-omit-frame-pointer in cmake/KernelFlags.cmake, on every translation unit"],
    ["Release switch", "NDEBUG, which CMake defines automatically for Release and RelWithDebInfo"]
  ],
  code: `// kernel/include/kernel/assert.hpp
#define KASSERT_ALWAYS(cond)                                              \\
    do {                                                                  \\
        if (!(cond)) [[unlikely]] {                                       \\
            panic("assertion failed: %s\\n  at %s:%d", #cond, __FILE__,    \\
                  __LINE__);                                              \\
        }                                                                 \\
    } while (0)

#ifdef NDEBUG
// sizeof does not evaluate its operand: no code, but still parsed,
// type-checked, and every variable named inside it still counts as used.
#  define KASSERT(cond) do { (void)sizeof((cond)); } while (0)
#else
#  define KASSERT(cond) KASSERT_ALWAYS(cond)
#endif

// kernel/lib/panic.cpp -- the frame-pointer walk
extern "C" const char __text_start[];   // arrays, NOT pointers
extern "C" const char __text_end[];

struct StackFrame { const StackFrame* next; uintptr_t ret; };

static bool frame_is_plausible(const StackFrame* f) {
    const uintptr_t a = reinterpret_cast<uintptr_t>(f);
    if (a < 0xFFFF800000000000ULL)            return false;  // null/user/non-canonical
    if (a > UINTPTR_MAX - sizeof(StackFrame)) return false;  // would wrap
    return (a & 0x7) == 0;                                   // misaligned
}

static void print_backtrace(const StackFrame* f) {
    const uintptr_t lo = reinterpret_cast<uintptr_t>(__text_start);
    const uintptr_t hi = reinterpret_cast<uintptr_t>(__text_end);
    for (unsigned i = 0; i < 32; ++i) {
        if (!frame_is_plausible(f)) break;          // validate BEFORE dereferencing
        const uintptr_t   ret  = f->ret;            // read once, into locals
        const StackFrame* next = f->next;
        if (ret < lo || ret >= hi) break;           // ends the walk at kmain
        put("  #"); put_dec(i); put("  0x"); put_hex(ret, 16); put("\\n");
        if (reinterpret_cast<uintptr_t>(next) <= reinterpret_cast<uintptr_t>(f))
            break;                                  // stacks grow down: must ascend
        f = next;
    }
}`,
  codelang: "cpp",
  walk: [
    ["do { ... } while (0)", "Makes the macro one statement, usable anywhere a statement is legal, that still requires its terminating semicolon. Bare braces break 'if (x) KASSERT(y); else z();' with 'error: else without a previous if' at the caller's line, not at the macro. A bare if with no braces is worse: it compiles and silently swallows the caller's else."],
    ["!(cond)", "The inner parentheses are mandatory. Without them KASSERT(a || b) expands to !a || b, a different expression that passes while the invariant is broken."],
    ["#cond", "Stringification: the preprocessor substitutes the argument's source text before macro expansion, so the panic prints the expression you wrote, not the expansion of the macros inside it."],
    ["__FILE__ and __LINE__", "Predefined macros expand at the point of use, which is the call site, not this header. That is the entire mechanism by which a macro in one file reports a line number in another."],
    ["(void)sizeof((cond))", "The release form. Not evaluated, so zero run-time cost; still type-checked, so a renamed variable breaks the release build immediately; still names the variable, so -Wunused-variable does not fire under -Werror. The plain ((void)0) alternative fails that last requirement."],
    ["extern \"C\" const char __text_start[]", "Declared as an array so the symbol's address is the value. Writing const char* instead reads eight bytes from that address and uses them as a pointer, which prints zero frames and looks like a broken walk."],
    ["if (!frame_is_plausible(f)) break;", "The most important line in the stage. Validation happens before the two loads. Validate after reading and you have already touched memory you were about to reject; unmapped, that is a page fault with no handler, a triple fault, and you lose the banner and message you already wrote."],
    ["a < 0xFFFF800000000000ULL", "One compare that rejects null, all user addresses and every non-canonical value at once. A canonical address has bits 63:48 equal to bit 47, and this is the lowest address with them all set, so anything at or above it is canonical by construction."],
    ["next <= f", "Stacks grow downward, so a caller's frame is always at a higher address than its callee's. Strict ascent kills a self-referential or backwards rbp in one iteration instead of thirty-two."],
    ["ret < lo || ret >= hi", "Ends the walk cleanly: kmain was called by Limine, whose code is not in your .text, so the first frame outside the kernel image stops it. It also rejects data that happened to look like a return address."]
  ],
  verify: [
    ["x86_64-elf-nm build/kernel.elf | grep ' T panic' ; x86_64-elf-objdump -d build/kernel.elf | grep -A2 '<kernel_init>:'", "one symbol line of type T, e.g. ffffffff80102b40 T panic; then 55 push %rbp and 48 89 e5 mov %rsp,%rbp as the first two instructions. If that prologue is missing the flag did not apply and the walk is fiction"],
    ["jq -r '.[].command' build/compile_commands.json | grep -c -- '-fno-omit-frame-pointer' ; jq -r '.[].command' build/compile_commands.json | wc -l", "the two numbers are equal — the flag reached every translation unit, not most of them. A flag set on most files produces a bug that only appears in some backtraces"],
    ["make run-serial with panic(\"test panic: %d\", 42) at the end of kernel_init", "banner, then 'test panic: 42', then the register block, then Backtrace: with at least two lines, all starting 0xFFFFFFFF8; QEMU does not reboot and prints nothing further"],
    ["x86_64-elf-addr2line -f -C -i -e build/kernel.elf 0xFFFFFFFF80101A2C", "kernel_init and kernel/main.cpp:143 — the line that called panic. Entries are return addresses, so pass addr-1 when a call is the last instruction of its line"],
    ["ps -o %cpu=,comm= -C qemu-system-x86_64", "under about 2%; pinned near 100 on one core means hlt is not executing or IF is set in the halt loop"]
  ],
  traps: [
    ["The machine reboots and prints nothing — exactly the behaviour panic was supposed to fix.", "You panicked inside the panic handler, almost always in the backtrace: a frame dereferenced before validation, or a predicate that let an unmapped address through. The fault has no handler, escalates to a triple fault, and throws away the banner already written. Check every pointer before the load, bound the walk at 32, and add the g_in_panic guard so a second entry parks the core immediately. Diagnose by commenting out print_backtrace: if message and registers appear, the walk is the problem."],
    ["The backtrace prints confident addresses that addr2line resolves to functions which were never on the stack.", "-fno-omit-frame-pointer is missing. At -O1 and above GCC frees rbp as a general-purpose register, so you are walking whatever integer it held. Zero frames is the lucky outcome; plausible lies cost you an afternoon in the wrong subsystem. Verify with the compile_commands.json grep, never by reading the CMake file."],
    ["QEMU pegs one host core at 100% after the panic.", "hlt without cli in the halt loop. hlt resumes on the next interrupt, so with IF set the core wakes on every timer tick and halts again — a very expensive spin loop. Write for (;;) { cli; hlt; }. The same symptom appears if a [[noreturn]] function falls off its end."],
    ["An unprivileged user program can halt the whole machine with one syscall.", "You asserted something the outside world controls: KASSERT(fd < MAX_FD) on a syscall argument, or on a length, or on a field read out of a disk image or a network packet. Ask: can anything outside this kernel's own source make this false? If yes it is a condition — return -EBADF, -EINVAL, -EFAULT, drop the packet — not an invariant."],
    ["The release build suddenly fails with unused-variable errors after you add asserts.", "Your release KASSERT discarded the condition text, most likely ((void)0). Under -Wall -Werror any variable only an assert reads becomes unused. Use the (void)sizeof((cond)) form, which keeps the variable named."],
    ["A KASSERT was doing real work and the bug only appears in release.", "Side effects in the condition. KASSERT(refcount_dec(obj) == 0) decrements in debug and does nothing in release, because sizeof never evaluates its operand, so you ship a leak that does not reproduce in the build you develop in. Conditions must be pure reads; if a check must run in release, that is what KASSERT_ALWAYS is for."]
  ],
  board: `Draw the stack first, growing downward with high addresses at the top, and draw three frames stacked in it. In the middle frame mark two slots: rbp+8 holding a return address with an arrow off to the right into a box labelled .text, and rbp+0 holding the caller's saved rbp with an arrow up into the next frame. Say out loud that this is a linked list the compiler builds for free, and that -fno-omit-frame-pointer is the only reason it exists. Now beside it write the four predicates as a checklist — above 0xFFFF800000000000, no wrap, 8-byte aligned, ascending — and draw the loop as: check, then load, never the reverse. Finally, to the left, draw the eight panic steps as a ladder from cli at the top to cli+hlt at the bottom, and write "each rung is more likely to fault than the one above" down the side; put a horizontal line between registers and backtrace and label it "first step that touches memory".`
};

B["s08"] = {
  what: `The build system turns a tree of source files into build/kernel.elf with one command. It has three jobs: work out what to build, work out what to rebuild when a header changes, and run the commands in parallel in a correct order. This project uses CMake with the Ninja backend, and CMake is a generator, not a build tool — it reads CMakeLists.txt and writes build/build.ninja, and Ninja does the building. Because the kernel is compiled for a bare machine rather than for your laptop, CMake needs a toolchain file: a small file read before any compiler probing that names the target system and the cross-compiler.`,
  why: `By Phase 4 there are forty source files with headers including other headers, and the failure that build systems exist to prevent is silent: you edit boot_info.hpp, some translation units get recompiled and some do not, and the binary contains object files built against two different definitions of the same struct. The symptom is a field reading as garbage and nothing in your diff explains it. Three toolchains also live in one tree — freestanding kernel, freestanding userspace, native host tests — and compiling any of them with another's flags gives either an incomprehensible link error or a binary that runs and is subtly wrong. CMake also emits compile_commands.json for free, which is what gives your editor go-to-definition and what CI mines to prove every kernel file carries -mno-red-zone.`,
  spec: [
    ["Toolchain file", "cmake/x86_64-kernel.cmake, passed with -DCMAKE_TOOLCHAIN_FILE=; CMake >= 3.20, Ninja backend"],
    ["Cross-compiling switch", "set(CMAKE_SYSTEM_NAME Generic) — setting it at all is what makes CMAKE_CROSSCOMPILING true"],
    ["The try-compile fix", "set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY) — a .a only compiles and archives, never links"],
    ["Segment alignment", "-Wl,-z,max-page-size=0x1000; the x86-64 linker default is 2 MiB"],
    ["Expected layout after link", "readelf -h entry point 0xFFFFFFFF80000000; readelf -S .text at file offset 0x00001000, not 0x00200000"],
    ["Output path override", "RUNTIME_OUTPUT_DIRECTORY ${CMAKE_BINARY_DIR} — scripts/mkimage.sh looks for build/kernel.elf, not build/kernel/kernel.elf"],
    ["Linker-script dependency", "LINK_DEPENDS on linker.ld; CMake cannot infer that -T means a dependency"],
    ["Debug info", "-g emits DWARF; those sections are not PT_LOAD, so they cost zero bytes of target memory"],
    ["Symbol file", "POST_BUILD x86_64-elf-objcopy --only-keep-debug -> build/kernel.sym"],
    ["Compile database", "set(CMAKE_EXPORT_COMPILE_COMMANDS ON) -> build/compile_commands.json, read by clangd, clang-tidy and the CI red-zone rule"]
  ],
  code: `# cmake/x86_64-kernel.cmake -- read very early, before any compiler probing
set(CMAKE_SYSTEM_NAME      Generic)      # "no operating system" => cross-compiling
set(CMAKE_SYSTEM_PROCESSOR x86_64)
set(CMAKE_CXX_COMPILER      x86_64-elf-g++)
set(CMAKE_ASM_NASM_COMPILER nasm)
# CMake verifies a compiler by LINKING a test executable: that needs crt0, a
# libc and main(). Building a static library only compiles and archives.
set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)  # nasm, objcopy run on the HOST
set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)   # never /usr/lib
set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)   # never /usr/include

# cmake/KernelFlags.cmake -- every flag, defined exactly ONCE
set(KERNEL_CXX_FLAGS
    -ffreestanding                    # no hosted runtime assumptions
    -fno-exceptions -fno-rtti         # no unwinder, no type tables    ADR-0007
    -fno-stack-protector              # no __stack_chk_fail to link against
    -fno-pic -fno-pie                 # loaded at one fixed address
    -nostdinc++                       # there is no libstdc++ in the image
    -mcmodel=kernel                   # addressing valid in the top 2 GiB
    -mno-red-zone                     # CRITICAL: interrupt frames clobber it
    -mno-sse -mno-mmx -mno-80387      # no FP state to save across interrupts
    -fno-omit-frame-pointer           # so panic() can walk rbp
    -g                                # DWARF: addr2line, gdb, kernel.sym
    -Wall -Wextra -Werror)
set(KERNEL_LINK_FLAGS
    -nostdlib -static                 # no crt0, no libc, no dynamic loader
    -Wl,-z,max-page-size=0x1000       # 4 KiB segments, not the 2 MiB default
    -Wl,--build-id=none)              # reproducible builds

# kernel/CMakeLists.txt -- sources listed explicitly; a glob never re-runs
add_executable(kernel.elf arch/x86_64/boot/entry.cpp lib/panic.cpp main.cpp)
target_compile_options(kernel.elf PRIVATE \${KERNEL_CXX_FLAGS})
target_include_directories(kernel.elf PRIVATE \${CMAKE_SOURCE_DIR}/kernel/include)
set(LD_SCRIPT \${CMAKE_SOURCE_DIR}/kernel/arch/x86_64/boot/linker.ld)
target_link_options(kernel.elf PRIVATE \${KERNEL_LINK_FLAGS} -T \${LD_SCRIPT})
set_target_properties(kernel.elf PROPERTIES
    LINK_DEPENDS             \${LD_SCRIPT}     # relink when the script changes
    RUNTIME_OUTPUT_DIRECTORY \${CMAKE_BINARY_DIR})  # build/kernel.elf, not build/kernel/`,
  codelang: "cmake",
  walk: [
    ["set(CMAKE_SYSTEM_NAME Generic)", "The single most important line. Setting CMAKE_SYSTEM_NAME at all is what puts CMake into cross-compiling mode; the value Generic means a system with no operating system, which suppresses every OS-specific behaviour CMake would otherwise apply."],
    ["set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)", "Without this, configure dies with 'is not able to compile a simple test program' before doing anything else, and the message points at the wrong problem entirely — the compiler is fine, it is the link of the probe that has no crt0, no libc and no main."],
    ["CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY", "Stops CMake cheerfully finding /usr/include/stdio.h and handing your kernel a header describing a Linux system it is not running on. Programs get NEVER because nasm and objcopy really do run on the host."],
    ["-mno-red-zone", "The AMD64 ABI lets a leaf function use the 128 bytes below rsp without adjusting rsp. In user space nothing else touches that memory; in kernel space an interrupt pushes its frame right there and silently destroys live data. No warning, no crash at the mistake, corruption found weeks later. This is why the flag is mechanised in CI, not reviewed."],
    ["-nostdinc++", "The toolchain image builds all-gcc and all-target-libgcc and stops, so there is no libstdc++ at all. Without this flag an accidental #include <cstdint> gets fixed by someone adding a host include path, and the kernel then compiles against headers for a different environment. With it the failure is immediate and unambiguous: use <stdint.h>."],
    ["-g", "Costs nothing at run time — the debug sections are not PT_LOAD, so they never occupy target memory, only disk. Without it addr2line answers ??:0, make gdb has no source lines, and kernel.sym holds nothing worth keeping. Stage 0.7 and Stage 1.7 both turn addresses back into source lines, so this flag is load-bearing for every debugging session."],
    ["-Wl,-z,max-page-size=0x1000", "You invoke the linker through g++, so linker options must be forwarded with -Wl and commas. Omit it and the linker pads every segment to 2 MiB: the image inflates by megabytes and the 4 KiB section alignment the linker script asked for is silently defeated, which is what Phase 15 needs for per-section permissions."],
    ["The explicit source list", "file(GLOB ...) is evaluated at configure time and does not re-run, so a new .cpp is silently not compiled and you get an undefined reference to a function sitting right there in the tree. Listing files makes adding one a two-line diff a reviewer sees."],
    ["LINK_DEPENDS ${LD_SCRIPT}", "CMake tracks #include dependencies automatically but has no idea that -T somefile means the output depends on that file. Without this line, editing linker.ld does not relink and your layout change appears to have no effect."],
    ["RUNTIME_OUTPUT_DIRECTORY ${CMAKE_BINARY_DIR}", "CMake mirrors the source subdirectory in the build tree, so this target would land at build/kernel/kernel.elf. mkimage.sh then dies with 'missing build/kernel.elf', which reads as 'the build did not run' when in fact it ran perfectly and put the file somewhere else."]
  ],
  verify: [
    ["make configure", "the line 'Check for working CXX compiler: /opt/cross/bin/x86_64-elf-g++ - skipped'. The word skipped is the try-compile fix working; an error here means the toolchain file was not passed"],
    ["x86_64-elf-readelf -h build/kernel.elf | grep -E 'Entry point|Machine|Type:'", "Type EXEC, Machine Advanced Micro Devices X86-64, Entry point address 0xffffffff80000000. An entry of 0x0 means ENTRY(kmain) did not resolve, usually a missing extern \"C\""],
    ["x86_64-elf-readelf -S build/kernel.elf | grep -A1 '\\.text'", "the file offset is 0x1000-aligned, not 0x200000-aligned — proof that max-page-size took effect"],
    ["jq -r '.[] | select(.file | test(\"/kernel/\")) | select((.command // (.arguments | join(\" \"))) | contains(\"-mno-red-zone\") | not) | .file' build/compile_commands.json", "prints nothing. Any file listed is compiled without the flag and will corrupt memory unpredictably. This is the exact query CI runs"],
    ["touch kernel/include/kernel/boot_info.hpp && make", "every translation unit that includes it rebuilds, and only those. This is the capability the whole stage buys"]
  ],
  traps: [
    ["Configure fails: The C++ compiler /opt/cross/bin/x86_64-elf-g++ is not able to compile a simple test program.", "The compiler is fine. CMake's probe tries to LINK an executable, which needs crt0, a libc and main. Add set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY) to the toolchain file. If it persists, read build/CMakeFiles/CMakeError.log — the real error is in there, not in the message CMake printed."],
    ["The build works but build/os.iso is tens of megabytes, or mkimage.sh says 'missing build/kernel.elf'.", "Two separate bugs. The size one is a missing -Wl,-z,max-page-size=0x1000, so every segment is padded to the 2 MiB default. The missing-file one is a missing RUNTIME_OUTPUT_DIRECTORY: your kernel is at build/kernel/kernel.elf."],
    ["undefined reference to 'memcpy' (or memset, memmove, memcmp).", "Not a build-system bug. The C++ standard requires a freestanding implementation to supply those four, and GCC emits calls to them for struct assignment, array initialisation and zeroing even when you never wrote the name. -nostdlib means nothing provides them: implement all four yourself in kernel/lib/string.cpp, and compile that file with -fno-builtin or GCC may optimise your memset into a call to memset."],
    ["fatal error: cstdint: No such file or directory.", "There is no libstdc++ in the toolchain image, and -nostdinc++ makes that fail immediately rather than depending on what happens to be installed. Use <stdint.h> plus your own kstd::. Never fix this by adding a host include path."],
    ["Editing linker.ld changes nothing in the output.", "LINK_DEPENDS is missing, so CMake does not know the link depends on the script. make clean proves it; LINK_DEPENDS fixes it permanently."],
    ["A new .cpp file is not compiled and its functions are undefined at link time, in a file you can see with your own eyes.", "You used file(GLOB ...). Globs are evaluated at configure time and do not re-run when files appear. List sources explicitly, so adding one is a diff a reviewer sees."]
  ],
  board: `Draw two boxes left to right: CMakeLists.txt into a box labelled "cmake -G Ninja: configure + generate", then an arrow to build/build.ninja, then sources feeding into a box labelled "ninja: build" that produces kernel.elf. Say the point out loud — CMake builds nothing. Underneath, draw three parallel lanes labelled kernel, userspace and host, and put a different compiler and standard library on each; circle the kernel lane and write "toolchain file" beside it. Then take one lane and expand it into the flag list, writing each flag on the left and the failure it prevents on the right, one per line, with -mno-red-zone in a box of its own. Finish with a small memory picture: a segment padded to 2 MiB versus the same segment at 0x1000, and write the one linker option that chooses between them.`
};

B["s09"] = {
  what: `Continuous integration is a service that runs your build and your tests automatically on every push and every pull request, and reports a green tick or a red X against the exact commit. This project uses GitHub Actions: a YAML file under .github/workflows/ describes jobs, each job gets a fresh virtual machine, and each job runs a list of steps. The hinge of the whole design is one key, container:, which runs every step of a job inside the same pinned Docker image that make shell drops you into on your laptop. CI therefore has no private build recipe, no apt-get list, no install-the-cross-compiler step that can drift from your machine's. Every job is a make verb that already works locally.`,
  why: `Kernel bugs do not fail near their cause: a heap bug in Phase 4 surfaces as a scheduler fault in Phase 12, and the bisect window is hundreds of commits. CI shrinks that window to one, because every green run is a recorded, machine-checked claim that at this commit the kernel built, linted and booted under four firmware and media combinations — a claim you cannot manufacture retroactively. Turn it on now, at three hundred lines, because the cost of enabling a rule scales with the size of the tree it must be true about: clang-format over one file passes trivially, over five thousand lines it reports every file. And a CI that starts red gets disabled temporarily and never comes back.`,
  spec: [
    ["Jobs", "lint (~30s), build (~2m), test-unit (~20s), test-kernel (~2m), test-boot (~3m x 4 in parallel); about 6 min warm, 12 cold"],
    ["Dependency edges", "test-kernel needs build (policy); test-boot needs build (mechanical — it downloads the images artifact)"],
    ["Concurrency", "group ci-<github.ref>, cancel-in-progress: true — one run per branch, a new push supersedes"],
    ["Boot matrix", "bios-iso, uefi-iso, uefi-img (all smp 1), uefi-smp (smp 4), with fail-fast: false"],
    ["Artifact", "name 'images' = os.iso, os.img, kernel.elf, kernel.sym; retention-days 14"],
    ["Exit device", "-device isa-debug-exit,iobase=0xf4,iosize=0x04; QEMU exit status = (N << 1) | 1"],
    ["Result mapping", "guest writes 0 -> exit 1 = PASS; writes 1 -> exit 3 = FAIL; nothing -> 124 from timeout(1) = hung; exit 0 -> test_exit() was never reached, which is why the low bit is forced set"],
    ["Required checks on master", "all five, and all four test-boot legs selected individually or the matrix is not really required"],
    ["Environment CI must set", "CONTAINER: 1 (the Makefile otherwise nests docker run) and OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd on Ubuntu 24.04"],
    ["Image pinning", "ghcr.io/<org>/os-toolchain@sha256:<digest>, repeated in all five container: lines — the env context is NOT available in container.image"]
  ],
  code: `name: CI
on:
  push: { branches: [master] }   # a push to a branch with NO open PR runs nothing
  pull_request:
  workflow_dispatch:             # the Run workflow button; you need it this stage
concurrency:
  group: ci-\${{ github.ref }}      # per-branch queue; per-PR on pull_request
  cancel-in-progress: true         # a fix-up commit kills the obsolete run
env:
  CONTAINER: 1                     # we ARE the container: do not nest docker run
  OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
jobs:
  lint:
    runs-on: ubuntu-latest
    container: ghcr.io/<org>/os-toolchain@sha256:<digest>
    steps:
      - uses: actions/checkout@v4
      - run: make compile-commands
      - name: 'Boundary: every kernel TU has -mno-red-zone'
        run: |
          bad=$(jq -r '.[] | select(.file | test("/kernel/"))
                     | select((.command // (.arguments | join(" ")))
                              | contains("-mno-red-zone") | not)
                     | .file' build/compile_commands.json)
          [ -z "$bad" ] || { echo "::error::missing -mno-red-zone: $bad"; exit 1; }
      - name: 'Boundary: limine.h confined to arch/x86_64/boot'
        run: |
          leak=$(grep -rl 'limine\\.h' kernel/ --include='*.?pp' 2>/dev/null \\
                 | grep -v '^kernel/arch/x86_64/boot/' || true)
          [ -z "$leak" ] || { echo "::error::limine.h leaked: $leak"; exit 1; }
  test-boot:
    needs: build                   # downloads the 'images' artifact build uploaded
    strategy:
      fail-fast: false             # keep all four verdicts, not just the first
      matrix:
        include:
          - { name: bios-iso, firmware: bios, media: iso, smp: 1 }
          - { name: uefi-iso, firmware: uefi, media: iso, smp: 1 }
          - { name: uefi-img, firmware: uefi, media: img, smp: 1 }
          - { name: uefi-smp, firmware: uefi, media: img, smp: 4 }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: images, path: build/ }
      - run: ./scripts/test.sh boot --firmware \${{ matrix.firmware }}
               --media \${{ matrix.media }} --smp \${{ matrix.smp }} --timeout 90`,
  codelang: "yaml",
  walk: [
    ["push: branches: [master]", "Narrower than it looks. Pushing a feature branch with no PR open runs nothing at all. That is deliberate — it avoids running twice per commit — but it means you must open a draft PR at the start of every branch, or widen to branches: ['**'] and accept the duplicates."],
    ["concurrency + cancel-in-progress", "One run per branch, and a new run cancels the old one. You gain: three commits in ninety seconds produce one run, for the tip. You give up: per-commit CI history on a branch, which is fine because the workflow squash-merges one stage per branch, and the squashed commit on master always gets a full run."],
    ["container: ghcr.io/<org>/os-toolchain@sha256:...", "The whole design in one line. Every step runs inside the identical image make shell gives you, so a CI failure reproduces with one local command. A digest is a content hash and cannot be moved, which makes 'which compiler built this binary' a fact recorded in git log and a toolchain upgrade a reviewable diff."],
    ["CONTAINER: 1", "The root Makefile wraps commands in docker run unless this is set. Inside a CI container there is no Docker daemon, so every make step dies with 'docker: command not found' — or hangs, because docker run -it waits on a TTY that does not exist."],
    ["The -mno-red-zone jq rule", "Protects ADR-0002's consequence. .[] streams the array; test(\"/kernel/\") keeps only kernel translation units, which is what excludes host tools that must NOT carry the flag; the // alternative operator handles generators that write arguments instead of command; contains(...) | not keeps the offenders. A human reviewer misses this on the fortieth pull request; a grep does not."],
    ["|| true after every grep", "grep exits 1 when it finds nothing, which is the success case here, and run: blocks execute under bash -e. Without || true the step aborts on the good outcome. Get this polarity wrong and the rule silently passes forever, which is why every rule change must be tested by deliberately violating it."],
    ["grep -v '^kernel/arch/x86_64/boot/'", "The anchor is load-bearing and fragile. grep -r ... kernel/ prints paths starting kernel/, so the anchor matches; write ./kernel/ instead and every path gains a ./, the exclusion never applies, and every legal file is reported as a leak."],
    ["The six boundary rules", "1: -mno-red-zone on every kernel TU (ADR-0002). 2: limine.h only under arch/x86_64/boot (ADR-0003, keeps the bootloader replaceable). 3: no inline asm outside kernel/arch (ADR-0008, keeps a second architecture additive and kernel/mm host-testable). 4: kernel never includes libc/ or user/ (ADR-0008, privilege and allocator separation). 5: no __DATE__ or __TIME__ (ADR-0005, reproducible builds). 6: no TODO without an issue number."],
    ["fail-fast: false", "The default cancels every remaining leg the moment one fails, destroying the information you actually want. All four red means the kernel or the linker script; bios-iso green with three UEFI red means the ESP or BOOTX64.EFI; uefi-iso green with uefi-img red means the GPT layout, not the kernel; only uefi-smp red means an SMP assumption. That table comes free from four parallel jobs and not at all from one failure plus three cancellations."],

B["s11"] = {
  what: `A linear framebuffer is a contiguous region of memory that a display controller reads continuously and turns into a signal for the panel. There is no command queue, no draw call, no acknowledgement: the controller walks the region from start to end about sixty times a second, and whatever bytes are in it appear on the glass. Limine put the adapter into a graphics mode before jumping to kmain and reported the base address, geometry and pixel format; Stage 0.3 copied those into BootInfo. Writing to that memory is the only step you ever take. Every glyph, cursor, panic screen and scrolled console in this kernel is a program that writes bytes into that rectangle.`,
  why: `On a UEFI-booted modern machine there is no VGA text buffer at 0xB8000 and no callable firmware print — the Graphics Output Protocol is unreachable once boot services are exited. A framebuffer is the only display that exists. And the failure mode of skipping it is unusually cruel: 0xB8000 is writable under Limine's direct map, so a write there succeeds, does nothing, and leaves you debugging correct code on a platform that does not implement what the code assumes. Everything else in Phase 1 is one function deep on top of the three routines written here.`,
  spec: [
    ["The formula", "offset = y * pitch + x * (bpp / 8); mapped region is pitch * height bytes"],
    ["pitch", "BYTES per scanline, reported separately; always >= width * bytes_per_pixel. Padding exists because display hardware fetches in bursts and rounds each scanline up to a 64- or 128-byte boundary"],
    ["The canonical example", "1366x768x32: 1366*4 = 5464, but pitch = 5504 — 40 bytes = 10 pixels of invisible padding per row"],
    ["QEMU's lie", "emulated adapters report pitch == width * bytes exactly, at every resolution. QEMU cannot test this"],
    ["Accepted bpp", "16, 24, 32. 15 is rejected: 15/8 == 1 would write every pixel one byte wide"],
    ["32bpp XRGB8888 masks", "red size 8 shift 16, green 8/8, blue 8/0 — pure red packs to 0x00FF0000"],
    ["16bpp RGB565 masks", "red 5/11, green 6/5, blue 5/0 — pure red packs to 0xF800"],
    ["Channel fit and store order", "v >>= (8 - size) keeps the HIGH bits (0xFF into 5 bits is 0x1F, not 0x07); the value is then stored little-endian, so 0x00FF0000 hits memory as 00 00 FF 00"],
    ["Address handling", "fb_addr is already a virtual address inside Limine's HHDM, already mapped and writable. Never add hhdm_offset to it"],
    ["Memory type and pointer type", "write-combining MMIO, so writes are buffered and fast while reads bypass the cache and cost hundreds of ns against about 1 ns for an L1 hit. Held as volatile uint8_t*; C++20 makes p[i] |= mask a build failure under -Wvolatile -Werror"]
  ],
  code: `// kernel/drivers/char/fbcon.cpp -- three rules: step by pitch and never by
// width; pack from the reported masks and never from a guess; never READ.
namespace {
struct FbState {
    volatile uint8_t* base;                    // write-combining MMIO
    uint32_t width, height, pitch, bytes_per_pixel;
    uint8_t red_size, red_shift, green_size, green_shift, blue_size, blue_shift;
    bool ready;
};
FbState g_fb;    // .bss: ready == false and base == nullptr before fb_init runs

// THE formula. The size_t casts force 64-bit arithmetic: uint32_t * uint32_t
// is evaluated in 32 bits and only widened afterwards.
inline volatile uint8_t* pixel_address(uint32_t x, uint32_t y) {
    return g_fb.base + static_cast<size_t>(y) * g_fb.pitch
                     + static_cast<size_t>(x) * g_fb.bytes_per_pixel;
}

// One loop covers 32, 24 and 16 bpp. A single 32-bit store would write four
// bytes into a three-byte pixel and assume an alignment nobody promised.
inline void store_pixel(volatile uint8_t* p, uint32_t value, uint32_t bytes) {
    for (uint32_t i = 0; i < bytes; ++i)
        p[i] = static_cast<uint8_t>(value >> (i * 8));
}

// size == 5 keeps the TOP five bits: 0xFF becomes 0x1F, not 0x07. fb_pack_colour
// ORs the three results, because the fields never overlap.
inline uint32_t place_channel(uint8_t v8, uint8_t size, uint8_t shift) {
    if (size == 0) return 0;                   // this mode has no such channel
    uint32_t v = v8;
    if (size < 8)      v >>= (8 - size);       // drop low bits, keep brightness
    else if (size > 8) v <<= (size - 8);       // 10-bit channel: scale up
    return v << shift;
}
}  // namespace

void fb_fill_rect(uint32_t x, uint32_t y, uint32_t w, uint32_t h, Colour c) {
    if (!g_fb.ready) return;
    if (x >= g_fb.width || y >= g_fb.height) return;  // origin off-screen
    if (w > g_fb.width  - x) w = g_fb.width  - x;     // clip ONCE, not per pixel
    if (h > g_fb.height - y) h = g_fb.height - y;
    for (uint32_t row = 0; row < h; ++row) {
        volatile uint8_t* p = pixel_address(x, y + row);  // recompute per row
        for (uint32_t col = 0; col < w; ++col) {
            store_pixel(p, c.value, g_fb.bytes_per_pixel);
            p += g_fb.bytes_per_pixel;
        }
    }
}`,
  codelang: "cpp",
  walk: [
    ["y * g_fb.pitch", "Pitch, not width, and not width * bytes_per_pixel. The display controller steps from one scanline to the next by adding pitch. Use a short row step and every row lands (pitch - width*bytes)/bytes pixels to the left of where the display expects it, and the error accumulates down the screen into diagonal stripes."],
    ["static_cast<size_t> on each left operand", "In C++, uint32_t * uint32_t is computed in 32 bits and the wrapped result is only widened afterwards, then zero-extended into your 64-bit pointer arithmetic. At 1280x800 nothing overflows and the cast is free. Casting one operand first forces the whole expression into 64 bits — make it a habit in any address computation."],
    ["volatile uint8_t* base", "uint8_t because all the arithmetic is in bytes and a typed pointer tempts you into indexing with the wrong unit. volatile because this is MMIO: nothing in the C++ abstract machine ever reads those bytes back, so an optimiser is within its rights to delete the stores. Volatile guarantees the store is emitted; it gives you no CPU ordering, no flush and no atomicity."],
    ["store_pixel's byte loop", "Byte i of a little-endian value is bits 8i..8i+7, which is exactly value >> (i*8) truncated. One body therefore writes any pixel width from 1 to 4 bytes in the machine's native order. Never lay out bytes by hand: reason about the value and let this function place them."],
    ["place_channel with size < 8", "Shifting RIGHT keeps the high bits, which is what preserves brightness. The tempting value & 0x1F keeps the LOW bits, so 0xFF happens to give 0x1F by luck while mid-grey 0x80 becomes 0x00 — every shade lands in the wrong place and gradients turn into stripes."],
    ["place_channel with size == 0", "The mode has no field for this channel, so contributing zero is the only correct answer. It also protects the shift below from an unsigned underflow of 8 - size when size > 8, which would be undefined behaviour."],
    ["fb_pack_colour ORs three place_channel results", "The fields do not overlap by construction, so OR is the entire composition. Every size and shift comes from a number the bootloader reported rather than from an assumption, which is the difference between 'works on my machine' and 'works'. Colour is a one-field struct so that fb_put_pixel(10, 10, 0xFF0000) stops compiling — that literal is the commonest first mistake here, and it is right by accident on QEMU."],
    ["if (x >= g_fb.width || y >= g_fb.height) return;", "The coordinates are unsigned, so a caller that computes a negative value hands you a huge positive one and the same comparison catches it. One test per axis covers both ends. Dropping rather than asserting is deliberate: a glyph half past the right margin is a legitimate thing for Stage 1.3 to draw."],

    ["make run", "a one-pixel white frame hugging all four edges, three bars top-left reading red then green then blue top to bottom, a short white diagonal from the top-right corner, and a solid rectangle one quarter of each axis, exactly centred"],
    ["grep 'fb:' build/serial.log", "fb: 1280x800x32 pitch=5120 (width*bytes=5120) @ 0xFD000000. The two middle numbers being equal is expected under QEMU and is itself the information that QEMU cannot test your pitch arithmetic"],
    ["edit boot/limine.conf to resolution: 1024x768x32, then make run", "the rectangle is still a quarter of the screen in each axis, still centred, still square-cornered, and the frame still hugs all four edges — proof that nothing hardcodes 1280x800"],

  ],
  traps: [
    ["The image is sheared into a parallelogram, or the screen is a field of slanted stripes.", "You used width where pitch belongs. Every row lands (pitch - width*bytes)/bytes pixels to the left, and it accumulates: at ten pixels per row, eighty rows in the picture has walked a full screen width sideways. Nothing faults, because the wrong addresses are all still inside the framebuffer — the bug is purely visual. QEMU will not reproduce it, so the code stays wrong and the screen stays right until real hardware."],
    ["Red comes out blue, or everything is muddy and banded.", "Two distinct causes. Swapped channels: either you built bytes by hand and forgot that storing 0x00FF0000 writes 00 00 FF 00 low byte first, or the adapter genuinely reports BGR with red_mask_shift 0 and blue_mask_shift 16, and the only correct response is to use the numbers you were given. Banded rather than swapped means a mask SIZE problem: an 8-bit value forced into a 5-bit field with & instead of >> keeps the low bits and scrambles brightness. Check the three bars: top to bottom must read red, green, blue."],
    ["Nothing on screen, but serial says the kernel ran fine.", "Four causes in order of likelihood. fb_init returned false — read the serial line, it names the failed check, usually fb_present == false because the framebuffer request never made it into .limine_requests. You called fb_test_pattern before fb_init, so ready is false and every call returned immediately. You drew off-screen and the bounds check silently dropped it. Or fb_pack_colour returns 0 for every input because all the masks are zero, and you drew black on black."],
    ["It works perfectly in QEMU and gives a black screen on real hardware.", "The catalogue of things QEMU is too generous about: exactly the resolution you asked for, always 32bpp, always 8/8/8 at 16/8/0, always pitch == width*bytes, and a BAR large enough that modest out-of-bounds writes go unnoticed. Real firmware gives the panel's native mode, a padded pitch, occasionally BGR, and no slack past the end of the buffer. Anything you hardcoded is fine there and wrong here."],
    ["Drawing is so slow you can watch the screen fill.", "You are reading framebuffer memory. A read bypasses the cache and goes across the bus. The read is rarely obvious in the source: it hides inside p[i] |= mask, inside any blending, and inside a scroll implemented as copy-each-row-up from the framebuffer to the framebuffer — which on 1280x800 reads about 4 MB across the bus. Never read g_fb.base; keep previous contents in RAM, which is exactly what Stage 1.4 does."],
    ["The machine reboots the instant you draw anything, or the build fails with 'compound assignment with volatile-qualified type is deprecated'.", "The reboot means you added hhdm_offset to fb_addr: Limine reports the address already inside its higher-half direct map, so adding the offset again yields an unmapped or non-canonical address, and with no IDT before Phase 2 that is a page fault, a double fault, a triple fault and a reset. The other route is a missing bounds check writing past the end. The build error is C++20 deprecating |= on volatile lvalues under -Wvolatile -Werror — never disable it, because read-modify-write on this memory is the previous trap; compute the value in registers and store it."]

  board: `Draw one wide rectangle for the panel and, beside it, a tall stack of rows for memory, with an arrow labelled "scanned out at 60 Hz, unprompted" between them; say that writing the memory is the only step. Now zoom into two adjacent memory rows and draw each as a long bar with a short shaded tail on the right labelled "padding, not displayed" — then write width * bytes under the unshaded part and pitch under the whole bar, and put the 1366x768 numbers 5464 and 5504 beside them. Write the formula offset = y*pitch + x*bytes underneath and box it. Next, draw a single 32-bit pixel as four cells labelled 31..24, 23..16, 15..8, 7..0, mark the shifts 16, 8, 0, then draw the same value going into memory as four bytes in the opposite order to make the little-endian point land. Finish by drawing the shear: three rows each starting one notch left of the one above, extended until it looks like stripes.`

B["s12"] = {
  what: `A bitmap font is a set of small pictures, one per character, stored as raw bits. Ours is 8 pixels wide by 16 pixels tall: 128 pixels, one bit each, so exactly 16 bytes per glyph. Each byte is one horizontal row of 8 pixels, called a scanline, and the top scanline is stored first. Inside a scanline byte, bit 7 (mask 0x80) is the leftmost pixel and bit 0 (mask 0x01) is the rightmost, which is the convention every VGA-derived and PSF font uses. Stack 256 of those 16-byte glyphs in index order and you have a 4096-byte blob; glyph g's scanline r sits at byte offset g*16 + r. The kernel never parses a font file: a host program named tools/mkfont turns the blob into a C++ source file at build time, and that file is compiled and linked like any other kernel source.`,
  why: `Without a rasteriser the framebuffer is a rectangle of coloured pixels and nothing more. There is no way to print a number, so there is no way to debug anything else. The font must be an array in .rodata rather than a file parsed at runtime because there is no filesystem until Phase 7, no heap until Phase 4, and no IDT until Phase 2 -- any fault on the print path is a triple fault and an instant silent reboot. The print path has to sit below everything else in the dependency graph, because it is what you debug everything else with.`,
  spec: [
    ["Glyph cell", "8 pixels wide x 16 pixels tall = 128 bits = 16 bytes"],
    ["Blob size", "exactly 4096 bytes; mkfont refuses any other size"],
    ["Blob path", "tools/mkfont/vga8x16.fnt (checked into git, .fnt not .bin)"],
    ["Byte offset of glyph g scanline r", "g * 16 + r"],
    ["Bit order", "0x80 = leftmost pixel, 0x01 = rightmost; set bit = ink"],
    ["Column-to-mask", "col 0 -> 0x80, col 1 -> 0x40, ... col 7 -> 0x01, i.e. 0x80 >> col"],
    ["Generated file", "build/kernel/generated/font8x16.cpp, never in the source tree"],
    ["Symbol and type", "font8x16, const uint8_t[256][16], external linkage, .rodata"],
    ["Symbol size from nm -S", "0000000000001000 (4096 bytes)"],
    ["Grid this creates", "cols = fb_width / 8, rows = fb_height / 16"]
  ],
  code: `// kernel/drivers/char/font.hpp
#pragma once
#include <stdint.h>   // NOT <cstdint> - there is no libstdc++ here

inline constexpr uint32_t FONT_WIDTH  = 8;
inline constexpr uint32_t FONT_HEIGHT = 16;
inline constexpr uint32_t FONT_GLYPHS = 256;

// Defined in the GENERATED font8x16.cpp. The extern is mandatory: in C++ a
// const object at namespace scope has INTERNAL linkage by default.
extern const uint8_t font8x16[FONT_GLYPHS][FONT_HEIGHT];

// Always index through this. unsigned char forces the 0..255 conversion at the
// call boundary so a high-bit byte can never index the array negatively.
inline const uint8_t* font_glyph(unsigned char code) { return font8x16[code]; }

// kernel/drivers/char/fbcon.cpp
void fb_putchar(char c, uint32_t x, uint32_t y, uint32_t fg, uint32_t bg) {
    const uint8_t* glyph = font_glyph(static_cast<unsigned char>(c));

    // Clip WHOLE glyphs. A half-drawn character looks like a renderer bug and
    // sends you debugging the loop; near the edge it also wraps onto the next
    // scanline or writes past the mapping.
    if (x + FONT_WIDTH > fb_width() || y + FONT_HEIGHT > fb_height()) return;

    for (uint32_t row = 0; row < FONT_HEIGHT; ++row) {
        const uint8_t bits = glyph[row];
        for (uint32_t col = 0; col < FONT_WIDTH; ++col) {
            // 0x80U >> col walks LEFT to RIGHT. (1u << col) mirrors every glyph.
            const bool lit = (bits & (0x80U >> col)) != 0;
            put_pixel(x + col, y + row, lit ? fg : bg);   // opaque, always
        }
    }
}`,

  what: `The console turns the framebuffer's rectangle of pixels into a rectangle of character cells. Divide the pixel dimensions by the glyph cell: cols = fb_width / FONT_WIDTH and rows = fb_height / FONT_HEIGHT, always truncating, because a partial cell is not a cell. Cell (col, row) occupies the 8x16 pixel rectangle whose top-left corner is at (col*8, row*16), and that mapping appears in exactly one function, draw_cell. The cursor is two integers saying where the next character goes; there is no hardware cursor in a linear framebuffer, so nothing is drawn for it yet. The text itself lives in a fixed array in RAM -- one two-byte Cell per position, holding a glyph index and a colour attribute -- and the framebuffer is treated as a rendering of that array, never as the copy of record.`,

struct Cell { uint8_t ch; uint8_t attr; };

uint32_t g_cols, g_rows, g_col, g_row;
uint8_t  g_attr;
bool     g_wrap_pending;

void draw_cell(uint32_t col, uint32_t row) {

    fb_putchar(static_cast<char>(c.ch), col * FONT_WIDTH, row * FONT_HEIGHT,

void put_printable(char c) {

    Cell& cell = g_grid[g_row][g_col];
    cell.ch = static_cast<uint8_t>(c);
    cell.attr = g_attr;

B["s14"] = {
  what: `The framebuffer is not RAM. The physical pages behind it are a PCI Base Address Register aperture -- a window the graphics device claims in the physical address space, which the host bridge routes to the device instead of to the memory controller. x86 tags that mapping write-combining (WC): stores do not enter the cache but accumulate in small 64-byte write-combining buffers and leave as one burst when a buffer fills, while loads are not cached, not combined and not prefetched, so each one is a full bus round trip that also forces the partial WC buffers out first. That makes writing to a framebuffer cheap and reading from it catastrophic. Double buffering means every drawing primitive writes to a back buffer in ordinary cached write-back RAM, and one function copies finished rows out to the device in a single strictly-increasing sweep of stores.`,
  why: `Stage 1.3's scroll repaints the whole screen cell by cell; a naive pixel memmove would be worse still, reading about 3.83 MiB out of the graphics device four bytes at a time -- roughly half a million bus round trips per scrolled line. Drawing into RAM turns every read the renderer does into an L1 hit and turns a scroll into a memmove the compiler can vectorise. It also removes the flicker: with direct drawing the framebuffer is genuinely incoherent for the entire duration of a redraw and the screen faithfully displays a half-scrolled image, whereas with a back buffer all the partial states happen where nothing is watching.`,
  spec: [
    ["Access latency", "L1 hit ~1 ns; DRAM miss ~60-100 ns; read from a device aperture ~0.5-2 us"],
    ["WC buffer width", "64 bytes on every x86-64 part - one cache line"],
    ["What forces a partial WC flush", "buffer fills (good), a write needing the buffer for another line, SFENCE/MFENCE/LOCK, a UC access, and a READ from WC memory"],
    ["Back buffer", "alignas(64) uint32_t g_back[BACK_MAX_PIXELS], 1280 x 800 = 1,024,000 px = 4,096,000 bytes"],
    ["Section", "no initialiser, so .bss / NOBITS: zero bytes in kernel.elf, zero-filled by Limine at load"],
    ["Back-buffer stride", "g_back_stride = g_width, in PIXELS (tightly packed)"],
    ["Framebuffer stride", "g_pitch = BootInfo::fb_pitch, in BYTES, and >= width * 4"],
    ["Dirty range", "half-open [g_dirty_y0, g_dirty_y1) in pixel rows; empty is UINT32_MAX / 0"],
    ["Fallback", "g_backbuf == nullptr when the mode exceeds BACK_MAX_PIXELS or is not 32bpp - correct, just slow, and logged"],
    ["Costs at 1280x800x32", "back-buffer scroll ~0.4 ms; full flush ~2 ms; one-text-line flush = 16 rows = 80 KiB ~40 us"]
  ],
  code: `// NO INITIALISER. That is what keeps it in .bss (NOBITS): 4,096,000 bytes of
// RAM at run time, ZERO bytes in kernel.elf. alignas(64) matches the WC buffer
// width so each flush starts on a buffer boundary instead of straddling two.
alignas(64) uint32_t g_back[BACK_MAX_PIXELS];

uint32_t* g_backbuf     = nullptr;   // null == unbuffered fallback
uint32_t  g_back_stride = 0;         // PIXELS per back-buffer row
uint32_t  g_pitch       = 0;         // BYTES per framebuffer scanline
uint32_t  g_dirty_y0 = UINT32_MAX, g_dirty_y1 = 0;

// THE ONLY FUNCTION IN THE KERNEL THAT TOUCHES THE FRAMEBUFFER IN BULK.
// It contains no loads from g_fb, and it must never grow one.
void flush_rows(uint32_t y0, uint32_t y1) {
    if (g_backbuf == nullptr || g_fb == nullptr) return;
    if (y1 > g_height) y1 = g_height;
    if (y0 >= y1) return;                       // nothing dirty

    const uint32_t*   src = g_backbuf + static_cast<size_t>(y0) * g_back_stride;
    volatile uint8_t* dst = g_fb      + static_cast<size_t>(y0) * g_pitch;

    for (uint32_t y = y0; y < y1; ++y) {
        volatile uint32_t* d = reinterpret_cast<volatile uint32_t*>(dst);
        for (uint32_t x = 0; x < g_width; ++x)
            d[x] = src[x];                      // d is WRITTEN. d is never read.
        src += g_back_stride;                   // pixels
        dst += g_pitch;                         // BYTES, and not width * 4
    }
}

void fb_mark_dirty(uint32_t y, uint32_t h) {    // EVERY back-buffer write calls this
    if (g_backbuf == nullptr || h == 0 || y >= g_height) return;
    if (h > g_height - y) h = g_height - y;
    if (y < g_dirty_y0)     g_dirty_y0 = y;
    if (y + h > g_dirty_y1) g_dirty_y1 = y + h;
}

void fb_flush()     { flush_rows(g_dirty_y0, g_dirty_y1); g_dirty_y0 = UINT32_MAX; g_dirty_y1 = 0; }
void fb_flush_all() { flush_rows(0, g_height);            g_dirty_y0 = UINT32_MAX; g_dirty_y1 = 0; }

// panic() calls this as its last act before cli;hlt forever. fb_flush_all(),
// not fb_flush(): a fault can land between a draw and its fb_mark_dirty.
void console_panic_sink(const char* text, size_t len) {
    for (size_t i = 0; i < len; ++i) putc_noflush(text[i]);
    fb_flush_all();
}`,
  codelang: "cpp",
  walk: [
    ["The missing initialiser", "The most consequential character in the file is the one that is not there. A static array with no initialiser is zero-initialised by the language and GCC places it in .bss, a NOBITS section that occupies no bytes in the ELF. Write = {1} and it becomes .data / PROGBITS and kernel.elf gains 3.91 MiB of mostly-zeros read off the disc on every boot. const is the same mistake with a different section name."],
    ["uint32_t, not uint8_t", "The back buffer is an array of pixels, so it is typed as one. Declaring it uint8_t[] and reading it through a uint32_t* is a strict-aliasing violation GCC is entitled to miscompile, and there is no -fno-strict-aliasing in this project's flags. Typing it correctly makes the question disappear rather than answering it."],
    ["alignas(64)", "WC buffers are 64 bytes wide. Starting the buffer on a 64-byte boundary means row 0 of every flush begins at the start of a buffer rather than partway into one, so the first burst is a full burst. One line, free."],
    ["g_back vs g_backbuf", "g_back is the storage; g_backbuf is the decision, and null means unbuffered. Every drawing function branches on that one pointer, so the fallback for an oversized mode is a single null check rather than a bool threaded through the file, and Phase 4 switching to kmalloc is one assignment."],
    ["src += g_back_stride vs dst += g_pitch", "Two strides, two units. The back buffer is tightly packed at width pixels per row; the framebuffer is pitch bytes per scanline, and pitch can exceed width * 4. Writing dst += width * 4 compiles, runs, and is correct on every machine where they happen to be equal - which is most of them, including your QEMU."],
    ["volatile on d, not on src", "The destination is MMIO, so volatile stops the compiler from eliminating, reordering or coalescing the stores into a memcpy call. src is ordinary RAM and is deliberately non-volatile so the load side stays fast. The same asymmetry in fb_scroll_up lets the RAM-to-RAM copy become rep movsb."],
    ["The inner loop's access pattern", "Strictly increasing addresses, stores only, no gaps: exactly what write-combining is built for. Every WC buffer fills to 64 bytes and leaves as one burst. This is why dirty tracking is rows-only - a narrow rectangle turns the flush into many short runs and a run under 64 bytes cannot fill a buffer."],
    ["fb_mark_dirty widens, never narrows", "The range is a running union, half-open so the empty test is a single comparison. The rule it depends on is auditable by grep: every function that writes the back buffer calls it. Miss one and flush_rows skips rows that genuinely changed."],
    ["fb_flush resets the range", "Forgetting the reset is invisible on screen and silently restores the full-screen cost forever. The mirror-image bug - marking nothing - makes the range permanently empty and nothing ever appears."],
    ["fb_flush_all in the panic sink", "Not optional and not interchangeable with fb_flush. Panic's last step is cli; hlt forever, so if the sink only writes the back buffer the report is in RAM when the machine stops. Serial still has it, which is exactly why the bug survives for months - until you are on hardware with no serial cable."]
  ],
  verify: [
    ["x86_64-elf-readelf -S build/kernel.elf | grep -A1 '\\.bss'", "The Type column must read NOBITS. PROGBITS means the buffer is file-backed and the image just grew by 3.91 MiB."],
    ["x86_64-elf-nm -S --size-sort build/kernel.elf | tail -3", "g_back appears with size 0x3e8000 (4,096,000) and a lowercase b for .bss. An uppercase D or lowercase d means .data and the image grew."],

    ["Boot a mode where pitch != width * 4, then look at the screen", "The image must be square, not sheared. This is the only check that catches the pitch/stride confusion, because on every mode where the two are equal the bug is invisible."],
    ["Replace fb_flush() with fb_flush_all() for one run", "If a stale region fixes itself, the bug is the dirty tracking, not the drawing. Then audit every write to g_backbuf for a matching fb_mark_dirty."]
  ],

    ["It is still slow", "One serial line separates the two causes. 'fbcon: UNBUFFERED' means the mode did not fit BACK_MAX_PIXELS or is not 32bpp, so every draw goes straight to the device. 'fbcon: buffered' means you are flushing too often - almost always fb_flush inside the character loop of console_write rather than after it, which turns a 60-character line into 60 full-screen copies."],

B["s15"] = {
  what: `The log ring is a fixed array of line slots plus one counter, used as if it were an infinite list. A line is written into g_lines[head % LOG_LINES] and head is incremented; when head passes the capacity the modulo wraps back to slot 0 and the oldest entry is overwritten. The critical design choice is that head is a count of lines ever written, not an index -- it never resets, so the oldest live line is head - LOG_LINES, the newest is head - 1, and the number of lines lost is head - LOG_LINES, all with no full flag and no tail pointer. Each line carries a severity level from Trace (0) up to Panic (5), and a line is recorded when level >= threshold, so Panic can never be filtered out. Output devices attach as sinks: function pointers that receive each line, and that receive the entire history replayed the moment they register.`,
  why: `A memory write cannot fail, cannot block, and works before any device is initialised. A UART write polls a status register and hangs forever on a wedged UART; a framebuffer write needs a valid mapping, a correct pitch and a font. Writing 252 bytes to RAM is nanoseconds, against roughly 87 microseconds per character at 115200 baud, and that difference is what makes it safe to put a log call inside a fault handler, inside the scheduler, or inside a spinlock critical section. The replay is the other half: a console that does not exist until step 6 of init still ends up showing everything logged from step 0.`,

#include <stdint.h>

extern "C" const char __text_start[];   // ARRAYS: we want the symbol's ADDRESS

extern const uint32_t ksyms_count;
extern const uint32_t ksyms_strings_size;
extern const uint64_t ksyms_addr[];      // strictly ascending

SymbolInfo symbol_lookup(uintptr_t addr) {

global isr_stub_table
%macro PUSHQ 1-*

    push %1
    %rotate 1
  %endrep
%endmacro
%macro POPQ 1-*
  %rep %0

    %rotate 1
  %endrep

%rep 256

#include <stdint.h>
#include "io.hpp"

static constexpr uint16_t PIC1_CMD = 0x20, PIC1_DATA = 0x21;
static constexpr uint16_t PIC2_CMD = 0xA0, PIC2_DATA = 0xA1;
static constexpr uint8_t  ICW1_INIT = 0x11;   // begin init, an ICW4 follows
static constexpr uint8_t  ICW4_8086 = 0x01;   // 8086 mode, normal EOI
static constexpr uint8_t  PIC_EOI   = 0x20;   // non-specific end of interrupt
static inline void io_wait() { outb(0x80, 0); }   // unused POST port, ~1us

void pic_remap(uint8_t master_off, uint8_t slave_off) {
    const uint8_t m1 = inb(PIC1_DATA), m2 = inb(PIC2_DATA);  // save masks
    outb(PIC1_CMD,  ICW1_INIT);  io_wait();
    outb(PIC2_CMD,  ICW1_INIT);  io_wait();
    outb(PIC1_DATA, master_off); io_wait();   // ICW2: master -> 32..39
    outb(PIC2_DATA, slave_off);  io_wait();   // ICW2: slave  -> 40..47
    outb(PIC1_DATA, 0x04);       io_wait();   // ICW3: mask, slave on line 2
    outb(PIC2_DATA, 0x02);       io_wait();   // ICW3: number, you are line 2
    outb(PIC1_DATA, ICW4_8086);  io_wait();
    outb(PIC2_DATA, ICW4_8086);  io_wait();
    outb(PIC1_DATA, m1); outb(PIC2_DATA, m2); // restore masks
}

void pic_send_eoi(uint8_t irq) {
    if (irq >= 8) outb(PIC2_CMD, PIC_EOI);    // slave first, then master
    outb(PIC1_CMD, PIC_EOI);
}

void pic_set_mask(uint8_t irq, bool masked) {
    const uint16_t port = (irq < 8) ? PIC1_DATA : PIC2_DATA;
    const uint8_t  bit  = static_cast<uint8_t>(1u << (irq & 7));
    const uint8_t  cur  = inb(port);
    outb(port, masked ? static_cast<uint8_t>(cur | bit)
                      : static_cast<uint8_t>(cur & ~bit));
}

uint16_t pic_isr() {                          // OCW3: read In-Service Register
    outb(PIC1_CMD, 0x0B); outb(PIC2_CMD, 0x0B);
    return static_cast<uint16_t>((inb(PIC2_CMD) << 8) | inb(PIC1_CMD));
}`,

static constexpr uint16_t PIT_CMD  = 0x43;
static constexpr uint32_t PIT_BASE = 1193182u;   // Hz, fixed by the crystal
static constexpr uint8_t  PIT_MODE = 0x36;       // ch0, lo/hi, mode 3, binary

static uint64_t g_ticks;      // written only by the IRQ 0 handler
static uint32_t g_hz;         // the rate we ACTUALLY got, not the one asked for

static void pit_tick(Registers*) {
    __atomic_fetch_add(&g_ticks, 1, __ATOMIC_RELAXED);   // and nothing else
}

void pit_init(uint32_t hz) {
    KASSERT(hz >= 19 && hz <= PIT_BASE);
    uint32_t div = PIT_BASE / hz;                // integer division, truncates
    if (div > 65536) div = 65536;
    if (div == 0)    div = 1;
    g_hz = PIT_BASE / div;
    uint16_t d = static_cast<uint16_t>(div & 0xFFFF);     // 65536 encodes as 0

    outb(PIT_CMD, PIT_MODE);
    outb(PIT_CH0, static_cast<uint8_t>(d & 0xFF));          // LOW byte first
    outb(PIT_CH0, static_cast<uint8_t>((d >> 8) & 0xFF));   // then HIGH byte

    register_irq_handler(0, pit_tick);
    irq_unmask(0);
}

uint64_t pit_ticks()     { return __atomic_load_n(&g_ticks, __ATOMIC_RELAXED); }
uint64_t pit_uptime_ms() { return pit_ticks() * 1000ull / g_hz; }

void pit_sleep_ms(uint64_t ms) {
    KASSERT(interrupts_enabled());               // hlt with IF clear never wakes
    uint64_t target = pit_ticks() + (ms * g_hz + 999) / 1000;
    while (pit_ticks() < target) __asm__ volatile("hlt" ::: "memory");
}`,

  walk: [

    ["PIT_MODE = 0x36", "Four fields in one byte: channel select, access mode, operating mode, BCD flag. Access mode 11 says you will write two bytes to the data port, low then high. Get the access field wrong and the chip interprets your first byte as the whole count."],

#include <stdint.h>

static constexpr uint16_t PS2_DATA   = 0x60;
static constexpr uint16_t PS2_STATUS = 0x64;   // read status, write command
static constexpr uint8_t  PS2_OBF    = 0x01;   // bit 0: output buffer full
static constexpr uint8_t  PS2_AUX    = 0x20;   // bit 5: byte is from the mouse

// Scancode set 1, make codes only. Index = code, value = ASCII, 0 = no char.
static const char kMapLower[128] = {
    0,27,'1','2','3','4','5','6','7','8','9','0','-','=','\\b',
    '\\t','q','w','e','r','t','y','u','i','o','p','[',']','\\n',
    0,'a','s','d','f','g','h','j','k','l',';','\\'','\`',
    0,'\\\\','z','x','c','v','b','n','m',',','.','/',0,'*',
    0,' ',
};
static const char kMapUpper[128] = { /* same shape, shifted glyphs */ };

// IRQ 1. Read the byte, queue it, get out. No translation in here.
static void kbd_irq(Registers*) {
    uint8_t st = inb(PS2_STATUS);
    if (!(st & PS2_OBF) || (st & PS2_AUX)) return;   // nothing, or not ours
    g_scancodes.push(inb(PS2_DATA));                 // single-producer ring
}

// Process context: one scancode in, one character out. 0 means "no character".
char kbd_translate(uint8_t sc) {
    static bool shift = false, caps = false, ext = false;
    if (sc == 0xE0) { ext = true; return 0; }
    bool    release = (sc & 0x80) != 0;
    uint8_t make    = sc & 0x7F;
    if (ext) { ext = false; return 0; }                 // arrows, Home: Phase 13
    if (make == 0x2A || make == 0x36) { shift = !release; return 0; }
    if (make == 0x3A) { if (!release) caps = !caps; return 0; }
    if (release) return 0;                              // one char per PRESS
    char c = shift ? kMapUpper[make] : kMapLower[make];
    if (caps && c >= 'a' && c <= 'z') c -= 32;          // caps XOR shift,
    if (caps && shift && c >= 'A' && c <= 'Z') c += 32; // letters only
    return c;
}`,

  why: `Without it every consumer of the keyboard has to reimplement backspace, echo and end-of-line, and the shell in Phase 8 has nothing to read. It is also the first place two contexts touch one data structure - the interrupt producing bytes, the kernel consuming them - so it is where you learn to write a critical section that is short enough to be safe and honest enough to survive Phase 5.`,

    ["Consumer", "readline, in process context, popping under an IRQ-save guard"],
    ["Critical section", "exactly one ring pop - the line buffer itself never leaves process context"],

  code: `// kernel/drivers/char/line.cpp - the v1 line discipline
#include <stdint.h>
#include <stddef.h>
static constexpr size_t LINE_MAX = 256;
static char g_line[LINE_MAX]; static size_t g_len; static bool g_ready;

// Process context only - called from readline's drain loop, so no lock needed.
static void line_put(char c) {
    if (c == '\\b') {                       // erase on screen AND in the buffer
        if (g_len == 0) return;             // never back up past column zero
        g_len--;
        console_write("\\b \\b", 3);
        return;
    }
    if (c == '\\n') {
        g_line[g_len] = '\\0';               // terminate before anyone sees it
        g_ready = true;  console_putc('\\n');
        return;
    }
    if (c < 0x20) return;                   // drop other control codes for now
    if (g_len + 1 >= LINE_MAX) return;      // the +1 reserves the NUL slot
    g_line[g_len++] = c;
    console_putc(c);                        // the kernel echoes, not the device
}

size_t readline(char* out, size_t max) {
    KASSERT(max >= 1 && interrupts_enabled());
    while (!g_ready) {
        uint8_t sc; bool got;
        { IrqGuard g; got = g_scancodes.pop(sc); }   // IRQ 1 is the producer
        if (got) { char c = kbd_translate(sc); if (c) line_put(c); continue; }
        __asm__ volatile("sti; hlt" ::: "memory");   // atomic pair, no lost wakeup
    }
    size_t n = g_len < max - 1 ? g_len : max - 1;
    for (size_t i = 0; i < n; i++) out[i] = g_line[i];
    out[n] = '\\0';
    g_len = 0;  g_ready = false;
    return n;
}`,

static constexpr uint64_t PAGE_SIZE = 4096;
extern "C" char __kernel_start[], __kernel_end[];   // linker symbols, VIRTUAL
static uint64_t* g_bitmap; static size_t g_words, g_total, g_free, g_cursor;
static inline void set_used(size_t f) { g_bitmap[f >> 6] |=  1ull << (f & 63); }
static inline void set_free(size_t f) { g_bitmap[f >> 6] &= ~(1ull << (f & 63)); }
static inline bool used(size_t f)     { return g_bitmap[f >> 6] >> (f & 63) & 1; }
void pmm_reserve(uint64_t base, uint64_t len) {   // rounds OUTWARD, always
    uint64_t last = (base + len + PAGE_SIZE - 1) / PAGE_SIZE;
    for (uint64_t f = base / PAGE_SIZE; f < last && f < g_total; f++)
        if (!used(f)) { set_used(f); g_free--; }
}
void pmm_reserve_kernel(const BootInfo& bi) {
    uint64_t vs = (uint64_t)__kernel_start, ve = (uint64_t)__kernel_end;
    pmm_reserve(vs - bi.kernel_virt_base + bi.kernel_phys_base, ve - vs);
    pmm_reserve(0, 0x100000);      // legacy low memory and the Phase 12 trampoline
}
uint64_t pmm_alloc_frame() {
    for (size_t i = 0; i < g_words; i++) {
        size_t w = (g_cursor + i) % g_words;
        if (g_bitmap[w] == ~0ull) continue;                 // 64 frames, one test
        size_t f = w * 64 + __builtin_ctzll(~g_bitmap[w]);  // lowest zero bit
        if (f >= g_total) continue;                         // tail padding bits
        set_used(f); g_cursor = w; g_free--;
        return f * PAGE_SIZE;                               // NUMBER * 4096 = ADDRESS
    }
    return 0;                                               // never a valid frame
}
void pmm_free_frame(uint64_t phys) {
    KASSERT(phys % PAGE_SIZE == 0);  size_t f = phys / PAGE_SIZE;
    KASSERT(used(f));              // fires at the double free, not ten minutes later
    set_free(f); g_free++;
}
uint64_t pmm_alloc_contiguous(size_t n) {   // DMA needs PHYSICALLY adjacent frames
    for (size_t f = 0, run = 0; f < g_total; f++) {
        if ((run = used(f) ? 0 : run + 1) < n) continue;
        size_t first = f + 1 - n;  for (size_t k = first; k <= f; k++) set_used(k);
        g_free -= n; return first * PAGE_SIZE;
    }
    return 0;

  what: `Every address your kernel code uses is a virtual address: a number the CPU hands to a piece of hardware called the MMU, which translates it into a physical address, an actual wire-level location in the RAM chips. The translation is driven by tables you build in memory. On x86_64 with 4 KiB pages there are four levels of table, named PML4, PDPT, PD and PT from the top down; each table is exactly one 4 KiB page holding 512 entries of 8 bytes each, and each entry is 64 bits of "physical address of the next thing, plus permission bits". A 48-bit virtual address is chopped 9/9/9/9/12: four 9-bit indices, one into each level, and a 12-bit offset inside the final 4 KiB frame. The register CR3 holds the physical address of the top table, so writing one number to CR3 replaces the entire meaning of every address in the machine.`,
  why: `Paging is what makes isolation and non-contiguity possible: two processes can both use address 0x400000 and get different RAM, and a 2 MiB allocation does not need 2 MiB of adjacent physical memory. Limine already turned paging on and handed us working tables, but those tables live in bootloader-reclaimable memory we want to free, and they carry coarse section permissions. Without our own tables we can never free that memory, never enforce W^X on the kernel image, and never build a second address space for a user process.`,

    ["HHDM base", "0xFFFF800000000000 = PML4 entry 256 (read the offset from Limine, never hardcode)"],

  code: `// kernel/arch/x86_64/mm/paging.cpp
#include <stdint.h>
#include "mm/pmm.hpp"

namespace paging {
constexpr uint64_t P    = 1ull << 0;    // present
constexpr uint64_t RW   = 1ull << 1;    // writable
constexpr uint64_t US   = 1ull << 2;    // ring 3 may touch it
constexpr uint64_t NX   = 1ull << 63;   // needs EFER.NXE set first
constexpr uint64_t ADDR = 0x000FFFFFFFFFF000ull;   // bits 51:12

extern uint64_t hhdm;   // Limine's HHDM offset. Read it, never hardcode it.

static inline uint64_t* at(uint64_t phys)         { return (uint64_t*)(phys + hhdm); }
static inline uint64_t  idx(uint64_t va, int lvl) { return (va >> (12 + 9 * lvl)) & 0x1FF; }

static uint64_t* descend(uint64_t* tbl, uint64_t i, uint64_t leaf_flags) {
    if (!(tbl[i] & P)) {
        uint64_t f = pmm::alloc_frame();                 // a page table IS a frame
        if (!f) return nullptr;
        for (int k = 0; k < 512; ++k) at(f)[k] = 0;      // zero, or inherit 512 junk mappings
        tbl[i] = f | P | RW | (leaf_flags & US);         // permissions AND down the chain
    }
    return at(tbl[i] & ADDR);
}

bool map_page(uint64_t pml4_phys, uint64_t va, uint64_t pa, uint64_t flags) {
    uint64_t* t = at(pml4_phys);
    for (int lvl = 3; lvl >= 1; --lvl) {                 // PML4 -> PDPT -> PD -> PT
        t = descend(t, idx(va, lvl), flags);
        if (!t) return false;
    }
    t[idx(va, 0)] = (pa & ADDR) | flags | P;
    asm volatile("invlpg (%0)" :: "r"(va) : "memory");
    return true;
}

void activate(uint64_t pml4_phys) {                      // PHYSICAL, not virtual
    asm volatile("mov %0, %%cr3" :: "r"(pml4_phys) : "memory");
}
} // namespace paging`,

#include <stdint.h>
#include <stddef.h>
#include "mm/vmm.hpp"

struct slab_cache;
struct slab {                       // lives at the base of its own 4 KiB page
    slab*       next;
    slab_cache* owner;
    uint16_t    free_head;          // object index, 0xFFFF = none free
    uint16_t    in_use;
};
struct slab_cache { size_t obj_size; slab* partial; slab* full; slab* empty; };

static slab_cache caches[8];        // 16, 32, 64, 128, 256, 512, 1024, 2048

static inline void* obj_at(slab* s, uint16_t i, size_t sz) {
    return (uint8_t*)s + sizeof(slab) + (size_t)i * sz;
}

static void* slab_alloc(slab_cache* c) {
    if (!c->partial) {
        uint64_t va = vmm::grow_heap(4096);            // map_page, RW | NX, eager
        if (!va) return nullptr;
        slab* s = (slab*)va;
        s->owner = c; s->in_use = 0; s->free_head = 0;
        uint16_t n = (uint16_t)((4096 - sizeof(slab)) / c->obj_size);
        for (uint16_t i = 0; i < n; ++i)               // free objects hold the links
            *(uint16_t*)obj_at(s, i, c->obj_size) = (i + 1 == n) ? 0xFFFF : (uint16_t)(i + 1);
        s->next = nullptr; c->partial = s;
    }
    slab*    s = c->partial;
    uint16_t i = s->free_head;
    s->free_head = *(uint16_t*)obj_at(s, i, c->obj_size);
    s->in_use++;
    if (s->free_head == 0xFFFF) { c->partial = s->next; s->next = c->full; c->full = s; }
    return obj_at(s, i, c->obj_size);
}

void* kmalloc(size_t n) {
    if (n == 0)    return nullptr;
    if (n > 2048)  return (void*)vmm::grow_heap((n + 4095) & ~(size_t)4095);
    size_t cls = 16; int k = 0;
    while (cls < n) { cls <<= 1; ++k; }
    return slab_alloc(&caches[k]);
}`,

volatile uint64_t g_ticks = 0;

// IRQ 0 callback. Interrupts are already off: vector 32 is an interrupt gate.
void timer_tick() {
    g_ticks++;
    sleep_list_expire(g_ticks);              // Stage 5.4 hooks in here
    task_t* cur = current;
    if (cur == g_idle) { cur->need_resched = 1; return; }
    if (--cur->slice_left == 0) cur->need_resched = 1;

void preempt_check() {
    task_t* cur = current;
    if (!cur->need_resched) return;
    if (cur->preempt_count != 0) return;     // a lock is held, or we are in a syscall

#include <stdint.h>
struct wait_queue { list_head waiters; spinlock lock; };

// Park the current task on wq. The CALLER must already hold wq.lock.
void wait_block(wait_queue& wq) {
    task_t* t = current;
    KASSERT(t != g_idle);                 // the idle task may never block
    rq_dequeue(t);                        // leave the run queue ENTIRELY

    list_add_tail(&wq.waiters, &t->queue_node);
    schedule_and_release(&wq.lock);       // drops the lock after the switch decision

// Usually called from an IRQ handler. Takes the same lock the blocker held.
void wait_wake_all(wait_queue& wq) {
    IrqLockGuard g(wq.lock);
    for (task_t* t = list_pop_head(&wq.waiters); t; t = list_pop_head(&wq.waiters)) {
        t->state = READY;
        rq_enqueue_tail(t);
    }

B["s63"] = {
  what: `A syscall is the one door from ring 3 into ring 0. The syscall instruction is not a jump to a fixed silicon address: it jumps to whatever the kernel wrote into the LSTAR model-specific register (an MSR is a CPU register addressed by number, read with rdmsr and written with wrmsr, both privileged). The instruction is deliberately minimal — it writes the return address into rcx, the old RFLAGS into r11, masks RFLAGS with SFMASK, loads CS and SS from STAR, sets CPL to 0, and then stops: no stack switch, no memory access, nothing pushed. So on arrival rsp still points into user memory and the gs base is still the user's, and the entry stub's first job is to fix both before it dares to push anything. Arguments arrive in rdi, rsi, rdx, r10, r8, r9 with the number in rax, and every pointer among them is hostile until proven otherwise.`,

; On entry the CPU has already done: rcx = return rip, r11 = user rflags,
; rflags &= ~SFMASK (so IF is off), CPL = 0. It did NOT switch the stack,
; did NOT touch memory, and did NOT change the gs base. rsp is still the user's.
;
; PUSH_GPRS / POP_GPRS are the same macros isr_stubs.asm uses, so the frame
; built here has the identical layout to registers_t.
%include "kernel/arch/x86_64/asm/gprs.inc"

%define PC_KERNEL_RSP 0x08      ; offsets into the per-CPU area -- keep in sync
%define PC_USER_RSP   0x10      ; with kernel/sched/percpu.hpp

extern syscall_dispatch
section .text
global syscall_entry
syscall_entry:
    swapgs                          ; gs: now names this CPU's per-CPU area
    mov [gs:PC_USER_RSP], rsp       ; the only place to park the user rsp
    mov rsp, [gs:PC_KERNEL_RSP]     ; the running task's kernel stack top

    push qword [gs:PC_USER_RSP]     ; frame.user_rsp
    PUSH_GPRS                       ; 15 registers; rcx holds the return rip

    mov rsp, [gs:PC_USER_RSP]       ; sysret does NOT restore rsp for you

    o64 sysret                      ; NASM spelling of sysretq`,

// the kernel AND by libc. Plain C. Changing it requires both reviewers.
#define SYS_read   0
#define SYS_write  1
#define SYS_exit  60
#define SYS_MAX   61
// ---------------- libc/src/syscall.hpp -- ring 3 only ----------------
#include <stddef.h>

static inline long __syscall3(long n, long a0, long a1, long a2) {
    long ret;
    __asm__ volatile("syscall"
                     : "=a"(ret)
                     : "a"(n), "D"(a0), "S"(a1), "d"(a2)
                     : "rcx", "r11", "memory");
    return ret;
}

static inline long __syscall4(long n, long a0, long a1, long a2, long a3) {
    register long r10 __asm__("r10") = a3;   // no constraint letter exists for r10
    long ret;
    __asm__ volatile("syscall"
                     : "=a"(ret)
                     : "a"(n), "D"(a0), "S"(a1), "d"(a2), "r"(r10)
                     : "rcx", "r11", "memory");
    return ret;

int errno;   // thread-local from Phase 13; a plain global is enough now

    return r;
}

    h2 += '<div class="trap"><b>The trap</b>'+esc(n.trap)+"</div>";
  }
  if(d.board){
    h2 += '<div class="sect2"><h3>Teaching it &middot; board plan</h3><div class="board">'+esc(d.board)+"</div></div>";
  }
  if(inbound.length){
    h2 += '<div class="sect2"><h3>Needs first</h3><div class="chips">';
    inbound.forEach(function(i){ if(byId[i]) h2 += '<span class="chip" data-go="'+i+'">'+esc(byId[i].t)+"</span>"; });
    h2 += "</div></div>";
  }
  if(outbound.length){
    h2 += '<div class="sect2"><h3>Unlocks</h3><div class="chips">';
    outbound.forEach(function(i){ if(byId[i]) h2 += '<span class="chip" data-go="'+i+'">'+esc(byId[i].t)+"</span>"; });
    h2 += "</div></div>";
  }
  pbody.innerHTML = h2;
  pbody.scrollTop = 0;
  pbody.querySelectorAll("[data-go]").forEach(function(c){
    c.addEventListener("click", function(){ var t=c.getAttribute("data-go"); focusNode(t); select(t); });
  });
  panel.classList.add("open");
}

function applySession(){
  document.querySelectorAll(".node").forEach(function(g){
    var i = g.getAttribute("data-id");
    g.classList.toggle("out", curSess!==0 && sessOf[i]!==curSess);
  });
}
document.querySelectorAll("#sess button").forEach(function(b){
  b.addEventListener("click", function(){
    curSess = +b.getAttribute("data-s");
    document.querySelectorAll("#sess button").forEach(function(x){ x.classList.toggle("on", x===b); });
    applySession();
    if(curSess!==0){
      var first = SESSIONS[curSess][0];
      focusNode(first); select(first);
    }
  });
});

function focusNode(id){
  var n=byId[id]; if(!n) return;
  var r=wrap.getBoundingClientRect();
  if(sc < .8){ sc = .95; }
  tx = (r.width-430)/2 - (n.x+n.w/2)*sc;
  ty = r.height/2 - (n.y+n.h/2)*sc;
  apply();
}
document.getElementById("pclose").addEventListener("click", function(){
  panel.classList.remove("open");
  document.querySelectorAll(".node").forEach(function(g){g.classList.remove("sel");});
  document.querySelectorAll(".edge").forEach(function(p){p.classList.remove("hot");});
});
