<script>
/* ============================================================
   THE MAP — one connected graph, power-on to shipped OS.
   Columns are phases. Every node links to what it enables.
   ============================================================ */
var P = [
  {k:0,  n:"Toolchain & First Boot"},
  {k:1,  n:"Console & Logging"},
  {k:2,  n:"CPU Tables & Interrupts"},
  {k:3,  n:"Timer & Keyboard"},
  {k:4,  n:"Memory Management"},
  {k:5,  n:"Multitasking"},
  {k:6,  n:"User Mode & Syscalls"},
  {k:7,  n:"VFS & Program Loading"},
  {k:8,  n:"The Shell"},
  {k:9,  n:"Storage"},
  {k:10, n:"Real Filesystems"},
  {k:11, n:"Modern Platform"},
  {k:12, n:"SMP"},
  {k:13, n:"Unix Process Model"},
  {k:14, n:"Networking"},
  {k:15, n:"Hardening"}
];

/* type: hw | concept | code | milestone
   lod : 0 always visible, 1 mid zoom, 2 close zoom          */
var N = [
/* ---------- pre-phase: the machine itself ---------- */
{id:"pwr", ph:-1, r:0, t:"Power applied", ty:"hw", lod:0,
 what:"You close the circuit. Voltage reaches the CPU, it comes out of reset in 16-bit real mode with the instruction pointer aimed at the very top of the address space, where the motherboard has mapped a flash chip.",
 why:"Nothing you wrote runs yet. Understanding that there is a defined starting state — a known mode, a known address — is what makes the rest of the chain make sense.",
 next:["fw"]},

{id:"fw", ph:-1, r:1, t:"Firmware", ty:"hw", lod:0, sub:"BIOS or UEFI",
 what:"Code burned into motherboard flash. It initialises RAM, the chipset and PCI, then looks for something bootable. Two families exist: legacy BIOS reads the first 512 bytes of a disk and jumps into them blindly; UEFI reads a GPT, mounts a FAT32 partition, and executes a named file.",
 why:"Firmware is the only thing that can start your code, and the two families find it in completely different ways. Supporting both is why the image build is more involved than it first looks.",
 trap:"On a modern UEFI machine there is no VGA text mode at all. Writing to 0xB8000 — the classic first-OS-tutorial move — produces a black screen with no error. The code is right and the platform is wrong, which is the worst kind of bug.",
 next:["limine"]},

{id:"limine", ph:-1, r:2, t:"Limine", ty:"hw", lod:0, sub:"the bootloader",
 what:"A bootloader that firmware can start. It reads limine.conf, scans your kernel ELF for request structures, sets a graphics mode, builds page tables, climbs the CPU from real mode all the way to 64-bit long mode, starts the other cores and parks them, then jumps to your entry point.",
 why:"Limine hands you a CPU already in long mode with paging on. You never write a mode-switch trampoline. That single decision is what makes targeting 64-bit tractable for a two-person team.",
 next:["s02"]},

/* ---------- Phase 0 ---------- */
{id:"s02", ph:0, r:0, t:"Limine requests", ty:"code", lod:0, stage:"0.2", file:"kernel/arch/x86_64/boot/entry.cpp",
 what:"Your first real file. You declare structs in a section called .limine_requests — one per service you want: framebuffer, memory map, HHDM offset, kernel address, modules, ACPI pointer. Limine finds them by scanning the binary and writes an answer into each before jumping to kmain.",
 why:"This is the handshake. Without it Limine has no idea your ELF is bootable and silently refuses to load it. The request/response shape means you ask only for what you need, and each answer is a typed struct rather than an offset into a flags word.",
 trap:"Forget __attribute__((used)) and the optimiser deletes the globals nobody appears to read. Limine then finds zero requests, every response pointer is null, and you page-fault at address 0 with no clue why.",
 next:["s03"]},

{id:"s03", ph:0, r:1, t:"BootInfo", ty:"code", lod:0, stage:"0.3", file:"boot_info.cpp, main.cpp",
 what:"Copy every Limine response into your own plain struct — framebuffer geometry, memory regions, HHDM offset, kernel physical and virtual base, module list, RSDP address. Null-check every response before touching it.",
 why:"Two reasons. First, nothing outside arch/x86_64/boot/ should ever know Limine exists, so swapping bootloaders means rewriting one file. Second, and more urgent: Limine's responses live in bootloader-reclaimable memory.",
 trap:"Phase 4's memory manager will hand those pages to someone else. A retained pointer keeps working for several phases and then starts returning garbage — with nothing in the diff to explain it. Copy everything at boot.",
 next:["s04"]},

{id:"s04", ph:0, r:2, t:"Linker script", ty:"code", lod:0, stage:"0.4", file:"linker.ld",
 what:"Tell the linker where the kernel lives in virtual memory: 0xFFFFFFFF80000000, the top 2 GiB. Align .text, .rodata, .data and .bss to 4 KiB so each can later get different page permissions. KEEP the Limine request sections so garbage collection cannot drop them. Export boundary symbols so the memory manager can reserve the kernel image.",
 why:"The top 2 GiB is exactly what -mcmodel=kernel assumes, so code and data references fit in 32-bit displacements instead of needing full 64-bit addressing everywhere.",
 trap:"Link anywhere else while compiling -mcmodel=kernel and you get relocation R_X86_64_32S out of range. Miss -z max-page-size=0x1000 and the linker assumes 2 MiB pages, padding the image by megabytes and quietly destroying your 4 KiB alignment.",
 next:["s05"]},

{id:"s05", ph:0, r:3, t:"FIRST BOOT", ty:"milestone", lod:0, stage:"0.5", file:"boot/limine.conf",
 what:"Wrap the kernel into a hybrid ISO that boots under BIOS and a GPT image that boots under UEFI. Then run it. Your kernel does nothing but halt — there is no output yet, deliberately.",
 why:"You verify through the QEMU monitor, not through printed text: Ctrl-Alt-2, then info registers. RIP sitting in 0xFFFFFFFF80... and unchanged between two checks proves your code is parked in its own hlt loop.",
 trap:"This precedes serial output on purpose. If you wrote the UART driver first and saw nothing, you would have three unverified things to debug at once — the image, the linker script, and the driver. One thing at a time.",
 next:["s06"]},

{id:"s06", ph:0, r:4, t:"FIRST OUTPUT", ty:"milestone", lod:0, stage:"0.6", file:"drivers/char/serial.cpp",
 what:"Drive the 16550 UART at port 0x3F8. Set the baud divisor behind the DLAB bit, configure 8N1, enable the FIFOs, run a loopback self-test, then poll the line-status register before writing each byte.",
 why:"Serial before the screen, always. It works before any display code exists, it survives the crash that follows, it is captured to a file, it works on real hardware with no text mode, and CI can read it. Every failure from here on is diagnosable.",
 trap:"Leave DLAB set and every byte you 'transmit' lands in the divisor register instead. Skip the transmit-ready poll and characters vanish, always in the interesting places.",
 next:["s07","s11"]},

{id:"s07", ph:0, r:5, t:"panic + KASSERT", ty:"code", lod:0, stage:"0.7", file:"lib/panic.cpp",
 what:"Disable interrupts, write to serial unconditionally, print the message, dump the registers, walk the frame pointers for a backtrace, then halt forever with cli; hlt.",
 why:"The default behaviour of a bare kernel on a fault is a silent reboot — no message, no state, just a loop. Panic replaces that with everything you know. Every in-kernel test from here on is built on KASSERT, so it cannot be an afterthought.",
 trap:"Dereference a bad frame pointer during the backtrace and you fault inside panic, which panics again, which triple-faults — losing the original message. Bound the walk and sanity-check every pointer before touching it.",
 next:["s08"]},

{id:"s08", ph:0, r:6, t:"Build system", ty:"code", lod:1, stage:"0.8", file:"CMakeLists.txt, cmake/",
 what:"Replace hand-typed compiler commands with CMake and Ninja: a cross-toolchain file, every kernel flag defined exactly once, and the link step that points at your linker script.",
 why:"Header dependency tracking. Edit boot_info.hpp by hand and you get object files built against two different definitions of one struct — a field reads as garbage and nothing in the diff explains it.",
 trap:"CMake verifies a compiler by LINKING a test program, which needs a libc you do not have. Set CMAKE_TRY_COMPILE_TARGET_TYPE to STATIC_LIBRARY or configure fails with a message pointing at entirely the wrong problem.",
 next:["s09"]},

{id:"s09", ph:0, r:7, t:"CI from day one", ty:"code", lod:1, stage:"0.9", file:".github/workflows/ci.yml",
 what:"Every push builds, lints and boot-tests across four combinations: BIOS+ISO, UEFI+ISO, UEFI+IMG, UEFI with four cores. The same container you use locally.",
 why:"Turning CI on now is trivial; turning it on after five thousand lines means it starts red, and a CI that starts red is ignored forever. From this moment every regression is attributed to the commit that caused it.",
 next:["s11"]},

/* ---------- Phase 1 ---------- */
{id:"s11", ph:1, r:0, t:"Framebuffer", ty:"code", lod:0, stage:"1.1", file:"drivers/char/fbcon.cpp",
 what:"Limine handed you a base address, width, height, pitch and pixel masks. Write a pixel by computing y*pitch + x*(bpp/8) and packing the colour using the reported mask shifts.",
 why:"There is no text mode. Text is something you draw. This is the foundation everything visual sits on.",
 trap:"pitch is bytes per scanline and is often LARGER than width*bytes-per-pixel because of hardware alignment. Compute the offset as y*width+x and you get a sheared, diagonal image — instantly recognisable once you have seen it.",
 next:["s12"]},

{id:"s12", ph:1, r:1, t:"Bitmap font", ty:"code", lod:1, stage:"1.2", file:"tools/mkfont/, font.hpp",
 what:"An 8x16 font is 16 bytes per glyph, one byte per scanline, one bit per pixel. A host-side tool converts a font file into a C array at build time; the kernel just indexes it and plots bits.",
 why:"No filesystem exists yet and no heap exists yet, so the font must be embedded. Floating point is banned kernel-wide, which rules out every scalable font technology anyway.",
 next:["s13"]},

{id:"s13", ph:1, r:2, t:"Console", ty:"code", lod:1, stage:"1.3", file:"drivers/char/console.cpp",
 what:"A character grid over the pixel surface: cols = width/8, rows = height/16, a tracked cursor, control characters, colour, wrapping and scrolling.",
 why:"Keep the text in a RAM grid and redraw, rather than moving pixels. Framebuffer memory is uncached write-combining — reads from it are one to two orders of magnitude slower than RAM.",
 next:["s14"]},

{id:"s14", ph:1, r:3, t:"Double buffering", ty:"code", lod:2, stage:"1.4", file:"fbcon.cpp",
 what:"Draw into ordinary cached RAM, then blit the finished frame to the framebuffer as one linear run of writes.",
 why:"Writes to write-combining memory are batched and fast; reads force a flush and crawl. Drawing into RAM means every read hits cache and only writes ever touch the device.",
 next:["s15"]},

{id:"s15", ph:1, r:4, t:"Log ring buffer", ty:"code", lod:1, stage:"1.5", file:"lib/log.cpp",
 what:"A fixed array of line slots with a wrapping head index and severity levels. Everything logs here first, then fans out to serial and the console.",
 why:"The memory write cannot fail, cannot block, and works before any device is initialised. When a fault happens the panic handler dumps the last N lines — otherwise the message that explained the crash has already scrolled away.",
 next:["s16"]},

{id:"s16", ph:1, r:5, t:"kprintf", ty:"code", lod:0, stage:"1.6", file:"lib/printf.cpp",
 what:"Your own formatted printer over <stdarg.h>. %d %u %x %s %c %p, flags, width, precision, length modifiers. No %f — the kernel has no floating point.",
 why:"This is the ideal first unit-test target: pure logic, enormous edge-case surface, no hardware. And a bug in it will mislead you about every other subsystem for years.",
 trap:"Negating INT64_MIN overflows. Convert via magnitude as unsigned, or printing your most negative number hangs or prints nonsense.",
 next:["s17"]},

{id:"s17", ph:1, r:6, t:"Symbolised backtraces", ty:"code", lod:2, stage:"1.7", file:"tools/symbolise/, symbols.cpp",
 what:"Embed a sorted symbol table in the kernel so a panic prints heap_expand+0x8C instead of 0xFFFFFFFF80104A2C.",
 why:"Worth an hour every single time you read a panic. Which, over fifteen phases, is a lot of hours.",
 trap:"Embedding the table changes the binary, which changes the addresses, which invalidates the table. Put it in its own section placed LAST so filling it cannot shift any .text address.",
 next:["s21"]},

/* ---------- Phase 2 ---------- */
{id:"s21", ph:2, r:0, t:"GDT", ty:"code", lod:0, stage:"2.1", file:"arch/x86_64/cpu/gdt.cpp",
 what:"Build your own descriptor table. In long mode segmentation is essentially disabled — base and limit are ignored — so a descriptor carries only privilege level and type.",
 why:"You still need valid selectors, the privilege level lives here, and sysret demands a very specific descriptor ORDER.",
 trap:"sysret derives user CS and SS from a fixed offset rule. Put user code before user data and no value of STAR lets you return to ring 3 — you would discover it in Phase 6 and have to rebuild the table. Enforce it with a static_assert now.",
 next:["s22"]},

{id:"s22", ph:2, r:1, t:"TSS + IST", ty:"code", lod:0, stage:"2.2", file:"arch/x86_64/cpu/tss.cpp",
 what:"In 64-bit the TSS holds three useful things: rsp0 (the stack the CPU switches to on a ring 3 to ring 0 transition), seven IST entries, and the I/O permission bitmap offset.",
 why:"The IST is the most valuable 64-bit addition. An IDT gate can name an IST slot, and that vector then switches to a known-good stack unconditionally.",
 trap:"Without it: stack overflow raises #PF, whose handler needs a stack, so it uses the overflowed one, causing #DF, which needs the same stack — triple fault, machine resets, zero diagnostic. One IST entry turns that into a readable panic.",
 next:["s23"]},

{id:"s23", ph:2, r:2, t:"IDT", ty:"code", lod:0, stage:"2.3", file:"arch/x86_64/cpu/idt.cpp",
 what:"256 gates of 16 bytes each. Each holds a handler address split across three fields, a code selector, an IST index, a privilege level and a gate type.",
 why:"Until this exists, any fault triple-faults the machine. This is the table that converts 'it rebooted' into 'page fault, write to 0xDEADBEEF, from heap_expand+0x8C'.",
 trap:"Forget the high 32 bits of the handler address and the CPU jumps to a truncated lower-half address. Give an exception vector DPL 3 and a user program can fake a page fault with int 14.",
 next:["s24"]},

{id:"s24", ph:2, r:3, t:"ISR stubs", ty:"code", lod:1, stage:"2.4", file:"arch/x86_64/asm/isr_stubs.asm",
 what:"256 tiny assembly entry points generated by a macro. Each pushes its vector number, pushes a dummy zero if that vector pushes no error code, saves every register, and calls one C++ dispatcher.",
 why:"The CPU never tells the handler which vector fired — the entry point IS the identity. And the error-code asymmetry means the stack layout would otherwise differ per vector.",
 trap:"The asm push order and the C++ Registers struct field order are two halves of one contract. Mismatch them and every register in every panic dump is silently wrong.",
 next:["s25"]},

{id:"s25", ph:2, r:4, t:"Exception handlers", ty:"code", lod:1, stage:"2.5", file:"cpu/exceptions.cpp",
 what:"Name every vector, decode the page-fault error code into readable text, read cr2 for the faulting address, and report it all through panic.",
 why:"Turning 'error code 2' into 'write to a non-present page from kernel mode' is the highest-leverage code in the phase. Every memory bug in Phase 4 becomes readable because of it.",
 trap:"cr2 is clobbered by any subsequent page fault — including one caused by your own printing. Read it first, before anything else can fault.",
 next:["s26"]},

{id:"s26", ph:2, r:5, t:"PIC remap", ty:"code", lod:2, stage:"2.6", file:"cpu/pic.cpp",
 what:"Two cascaded 8259 chips. By default they deliver IRQ 0-7 to vectors 8-15, which collide head-on with CPU exceptions. Remap them to 32-47.",
 why:"Vector 8 is double-fault and vector 13 is general protection. Without remapping, a timer tick is indistinguishable from a serious CPU fault.",
 trap:"For IRQ 8-15 you must send end-of-interrupt to BOTH chips. Miss the slave and that interrupt fires exactly once, then never again, silently.",
 next:["s27"]},

{id:"s27", ph:2, r:6, t:"Hardware IRQs", ty:"code", lod:1, stage:"2.7", file:"cpu/irq.cpp",
 what:"A registration table mapping IRQ numbers to handler functions, plus the first sti — the moment you allow interrupts to arrive.",
 why:"Interrupts arrive between any two instructions. That single fact is the root of every concurrency rule in the rest of the project.",
 trap:"Handlers run with interrupts disabled and block everything else. Acknowledge the device, grab the data, queue the work, return. Real work in the top half means missed ticks and dropped keystrokes.",
 next:["s31"]},

/* ---------- Phase 3 ---------- */
{id:"s31", ph:3, r:0, t:"Timer (PIT)", ty:"code", lod:0, stage:"3.1", file:"drivers/char/pit.cpp",
 what:"Program the 8253/8254 to fire IRQ 0 at a chosen frequency — typically 100 or 1000 Hz — and count ticks in the handler.",
 why:"A steady heartbeat is what makes preemption possible. Without a timer interrupt the scheduler can never take control back from a task that does not yield.",
 next:["s32","s53"]},

{id:"s32", ph:3, r:1, t:"Keyboard", ty:"code", lod:1, stage:"3.2", file:"drivers/char/keyboard.cpp",
 what:"The PS/2 controller raises IRQ 1 with a scancode. Translate scancodes to characters, track shift and caps state, handle make and break codes.",
 why:"Your first input device. Scancodes are not ASCII and the mapping is genuinely fiddly — a good lesson in how little hardware does for you.",
 next:["s33"]},

{id:"s33", ph:3, r:2, t:"Line buffer", ty:"code", lod:2, stage:"3.3", file:"drivers/char/line.cpp",
 what:"Collect keystrokes into a line, handle backspace, echo characters, and release the line on Enter.",
 why:"This is the seed of the TTY line discipline that Phase 13 grows into something real.",
 next:["s41"]},

/* ---------- Phase 4 ---------- */
{id:"s41", ph:4, r:0, t:"Memory map", ty:"code", lod:0, stage:"4.1", file:"mm/pmm.cpp",
 what:"Walk the memory regions Limine reported. Each has a base, a length and a type: usable, reserved, ACPI reclaimable, bootloader reclaimable, bad.",
 why:"This is the ground truth about how much RAM exists and which parts you may touch. It is not sorted and not contiguous — treat it as an unordered list.",
 next:["s42"]},

{id:"s42", ph:4, r:1, t:"Frame allocator", ty:"code", lod:0, stage:"4.2", file:"mm/pmm.cpp",
 what:"Hand out and reclaim 4 KiB physical frames. A bitmap — one bit per frame — is simple, compact and easy to debug.",
 why:"Every higher-level allocation eventually asks this for physical memory. Reserve the kernel image using the linker symbols from Stage 0.4, or it will cheerfully hand out its own code.",
 next:["s43"]},

{id:"s43", ph:4, r:2, t:"Paging", ty:"code", lod:0, stage:"4.3", file:"arch/x86_64/mm/paging.cpp",
 what:"Build your own 4-level page tables and load CR3. A virtual address splits into four 9-bit indices and a 12-bit offset; each level is a 512-entry table.",
 why:"You take ownership of the address space from Limine. From here you control every mapping, every permission bit, and every process's view of memory.",
 trap:"Unmap a page and forget invlpg and the CPU keeps using a cached translation. It works, then does not, depending on TLB pressure — nearly impossible to reproduce.",
 next:["s44"]},

{id:"s44", ph:4, r:3, t:"Kernel heap", ty:"code", lod:0, stage:"4.4", file:"mm/heap.cpp",
 what:"kmalloc and free on top of the frame allocator, usually with a slab layer for fixed-size objects.",
 why:"The hinge of the whole project. Almost everything after this — global constructors, the scheduler, the VFS, every driver — needs dynamic allocation.",
 next:["s51"]},

/* ---------- Phase 5 ---------- */
{id:"s51", ph:5, r:0, t:"Tasks", ty:"code", lod:0, stage:"5.1", file:"sched/task.cpp",
 what:"A task is a saved register set, a kernel stack, and an address space. Define the structure and how a new one is created ready to run.",
 why:"Everything about multitasking follows from the realisation that a running program is just this state, and switching is just swapping it.",
 next:["s52"]},

{id:"s52", ph:5, r:1, t:"Context switch", ty:"code", lod:0, stage:"5.2", file:"arch/x86_64/asm/switch.asm",
 what:"Save callee-saved registers onto the current stack, swap RSP to the next task's stack, restore, and return — into different code from where you entered.",
 why:"Written in assembly because C++ makes no promise about which registers it touches before you have saved them.",
 next:["s53"]},

{id:"s53", ph:5, r:2, t:"Preemption", ty:"code", lod:0, stage:"5.3", file:"sched/sched.cpp",
 what:"The timer interrupt calls the scheduler, which may pick a different task and switch to it — whether the running task wanted to yield or not.",
 why:"This is what separates a real OS from a cooperative toy. One misbehaving program can no longer freeze the machine.",
 next:["s54"]},

{id:"s54", ph:5, r:3, t:"Sleep & blocking", ty:"code", lod:1, stage:"5.4", file:"sched/wait.cpp",
 what:"Wait queues. A task waiting on I/O leaves the run queue entirely and is woken when the event arrives.",
 why:"A blocked task the scheduler still picks burns the whole CPU and never progresses. Blocking correctly is what makes the system efficient rather than merely working.",
 next:["s61"]},

/* ---------- Phase 6 ---------- */
{id:"s61", ph:6, r:0, t:"Per-task rsp0", ty:"code", lod:1, stage:"6.1", file:"cpu/tss.cpp",
 what:"Update the TSS rsp0 field on every context switch so the CPU always finds the right kernel stack when this task traps in.",
 why:"Each task needs its own kernel stack. Get this wrong and two tasks share one, corrupting each other in ways that look like random memory bugs.",
 next:["s62"]},

{id:"s62", ph:6, r:1, t:"Ring 3", ty:"code", lod:0, stage:"6.2", file:"arch/x86_64/cpu/usermode.cpp",
 what:"Construct an interrupt frame by hand with user selectors and iretq into it. The CPU drops privilege and starts running unprivileged code.",
 why:"The first time your OS runs a program it cannot trust. Everything about security starts here.",
 next:["s63"]},

{id:"s63", ph:6, r:2, t:"Syscalls", ty:"code", lod:0, stage:"6.3", file:"syscall/dispatch.cpp",
 what:"Set up LSTAR, STAR and SFMASK so the syscall instruction enters your kernel. Number in rax; arguments in rdi, rsi, rdx, r10, r8, r9; return in rax.",
 why:"The only doorway between the two worlds. syscall/sysret rather than int 0x80 because it is roughly an order of magnitude faster on x86_64.",
 trap:"The fourth argument goes in r10, not rcx, because the syscall instruction itself clobbers rcx with the return address. Every user pointer is hostile: validate canonical, below the ceiling, mapped, correct permission — a missing check is total kernel compromise.",
 next:["s64"]},

{id:"s64", ph:6, r:3, t:"Minimal libc", ty:"code", lod:1, stage:"6.4", file:"libc/",
 what:"Thin wrappers that put arguments in the right registers and execute syscall, plus enough string and memory functions for a program to be useful.",
 why:"Userspace programs need something to call. Syscall numbers live in one shared header so kernel and libc can never disagree.",
 next:["s71"]},

/* ---------- Phase 7 ---------- */
{id:"s71", ph:7, r:0, t:"initrd", ty:"code", lod:1, stage:"7.1", file:"tools/mkinitrd, fs/",
 what:"A tar archive Limine loads into memory as a module. Your first filesystem contents, available before any disk driver exists.",
 why:"You need files to run a program, and a disk driver is six phases away. This bridges the gap.",
 next:["s72"]},

{id:"s72", ph:7, r:1, t:"Read-only FS", ty:"code", lod:2, stage:"7.2", file:"fs/tmpfs/",
 what:"Parse the tar format, expose files by path, support open and read.",
 why:"Simple enough to debug, real enough to load a program from.",
 next:["s73"]},

{id:"s73", ph:7, r:2, t:"VFS", ty:"code", lod:0, stage:"7.3", file:"fs/vfs.cpp",
 what:"The abstraction layer: superblock, inode, dentry and file. One open/read/write/close that works across tmpfs, FAT32 and ext2 without the caller knowing which.",
 why:"This indirection is what lets you add ext2 in Phase 10 without touching a single syscall.",
 next:["s74"]},

{id:"s74", ph:7, r:3, t:"ELF loader", ty:"code", lod:0, stage:"7.4", file:"fs/elf.cpp",
 what:"Read an ELF file, map its PT_LOAD segments into a fresh address space with the right permissions, set up a stack, and jump to its entry point in ring 3.",
 why:"The moment your OS can run a program it did not build in. This is what makes everything after it possible.",
 next:["s81"]},

/* ---------- Phase 8 ---------- */
{id:"s81", ph:8, r:0, t:"Shell loop", ty:"code", lod:1, stage:"8.1", file:"user/sh/",
 what:"Read a line, parse it into a command and arguments, execute, print the result, repeat.",
 why:"The oldest interface in computing, and the one that makes the system feel alive.",
 next:["s82"]},

{id:"s82", ph:8, r:1, t:"Built-ins", ty:"code", lod:2, stage:"8.2", file:"user/sh/builtin.cpp",
 what:"cd, exit, echo, pwd — commands the shell handles itself because they change its own state.",
 why:"cd cannot be an external program: a child process changing directory would not affect its parent.",
 next:["s83"]},

{id:"s83", ph:8, r:2, t:"Launching programs", ty:"code", lod:1, stage:"8.3", file:"user/sh/exec.cpp",
 what:"Find the binary, load it, run it, wait for it, collect the exit code.",
 why:"The shell becomes a launcher rather than a fixed menu.",
 next:["s84"]},

{id:"s84", ph:8, r:3, t:"BOOTS TO A PROMPT", ty:"milestone", lod:0, stage:"8.4", file:"user/init/",
 what:"init is process 1. It starts the shell and adopts orphans. Your OS boots to something a person can log into and use.",
 why:"The line where this stops being an exercise. Everything after here is making it a product rather than making it work.",
 next:["s91","s111"]},

/* ---------- Phase 9 ---------- */
{id:"s91", ph:9, r:0, t:"Block devices", ty:"code", lod:1, stage:"9.1", file:"drivers/block/blockdev.cpp",
 what:"A uniform interface — read_blocks, write_blocks, block_size — that every storage driver implements.",
 why:"Filesystems should not know whether they sit on SATA, NVMe or a RAM disk.",
 next:["s92"]},

{id:"s92", ph:9, r:1, t:"DMA", ty:"concept", lod:1, stage:"9.2", file:"mm/dma.cpp",
 what:"The device writes straight into RAM without the CPU copying anything. The buffer must be physically contiguous and its physical address handed to the controller.",
 why:"Copying every sector through the CPU would make storage unusably slow. It also imposes a new requirement on the frame allocator.",
 next:["s93"]},

{id:"s93", ph:9, r:2, t:"Buffer cache", ty:"code", lod:2, stage:"9.3", file:"drivers/block/bcache.cpp",
 what:"Keep recently used blocks in memory, track which are dirty, and write them back later.",
 why:"Disks are orders of magnitude slower than RAM. Without a cache every path lookup would hit the platter.",
 next:["s95"]},

{id:"s95", ph:9, r:3, t:"AHCI / NVMe", ty:"code", lod:1, stage:"9.5-9.6", file:"drivers/block/ahci/, nvme/",
 what:"Real controller drivers. AHCI uses command lists and FIS structures; NVMe uses submission and completion queue pairs.",
 why:"NVMe is architecturally simpler despite being newer — a good demonstration that newer hardware is sometimes easier, not harder.",
 next:["s101"]},

/* ---------- Phase 10 ---------- */
{id:"s101", ph:10, r:0, t:"Mounting", ty:"code", lod:2, stage:"10.1", file:"fs/mount.cpp",
 what:"A mount table binding a filesystem instance to a path, and path resolution that crosses those boundaries.",
 why:"Turns a set of separate filesystems into one namespace.",
 next:["s102"]},

{id:"s102", ph:10, r:1, t:"FAT32", ty:"code", lod:1, stage:"10.2-10.4", file:"fs/fat32/",
 what:"Boot sector, the file allocation table as a linked list of clusters, 8.3 directory entries, and VFAT long names chained across multiple entries with a checksum.",
 why:"UEFI mandates FAT for the ESP, so you need it regardless. It is also simple enough to get right early.",
 next:["s105"]},

{id:"s105", ph:10, r:2, t:"ext2", ty:"code", lod:1, stage:"10.5-10.7", file:"fs/ext2/",
 what:"Superblock, block groups, inodes, and direct plus indirect block pointers. Real permissions, hard links and timestamps.",
 why:"A proper Unix filesystem. This is where file ownership and modes stop being decoration.",
 next:["s108"]},

{id:"s108", ph:10, r:3, t:"DATA SURVIVES REBOOT", ty:"milestone", lod:0, stage:"10.8", file:"fs/, boot/",
 what:"Write a file, power-cycle the machine, read it back.",
 why:"The moment persistence becomes real. Everything before this lived in RAM and vanished.",
 next:["s131"]},

/* ---------- Phase 11 ---------- */
{id:"s111", ph:11, r:0, t:"ACPI", ty:"code", lod:1, stage:"11.1-11.2", file:"drivers/acpi/",
 what:"Find the RSDP Limine gave you, validate checksums, walk the table pointers, and parse the MADT for interrupt topology.",
 why:"ACPI is how modern firmware describes the machine: how many cores, where the interrupt controllers are, how to power off.",
 next:["s113"]},

{id:"s113", ph:11, r:1, t:"PCI", ty:"code", lod:1, stage:"11.3", file:"drivers/pci/",
 what:"Enumerate the bus, read vendor and device IDs, decode BARs to find each device's registers.",
 why:"Every real device — disk controller, network card — is found this way.",
 next:["s114"]},

{id:"s114", ph:11, r:2, t:"APIC", ty:"code", lod:1, stage:"11.4-11.5", file:"cpu/lapic.cpp, ioapic.cpp",
 what:"Replace the 8259 PIC with the local APIC and I/O APIC: per-core interrupt handling, flexible routing, and inter-processor interrupts.",
 why:"The PIC cannot address multiple cores. Without the APIC there is no SMP.",
 next:["s116"]},

{id:"s116", ph:11, r:3, t:"HPET / TSC", ty:"code", lod:2, stage:"11.6-11.7", file:"drivers/acpi/hpet.cpp",
 what:"High-precision timers, TSC calibration, and reading wall-clock time from the RTC.",
 why:"The PIT is coarse and legacy. Real scheduling and real timeouts need better resolution.",
 next:["s121"]},

/* ---------- Phase 12 ---------- */
{id:"s121", ph:12, r:0, t:"Per-CPU data", ty:"concept", lod:0, stage:"12.1", file:"sched/percpu.hpp",
 what:"Each core needs its own current task, run queue, TSS with its own rsp0, and idle task — reached through the GS base register.",
 why:"'The current task' is meaningless globally once four cores are running. swapgs flips GS on every ring transition.",
 next:["s122"]},

{id:"s122", ph:12, r:1, t:"Atomics & ordering", ty:"concept", lod:0, stage:"12.2", file:"lib/atomic.hpp",
 what:"Compare-and-swap, fetch-and-add, and memory barriers. What the x86 memory model guarantees for free and what it does not.",
 why:"volatile provides neither atomicity nor ordering. Using it for shared state is a race that works until it does not.",
 next:["s123"]},

{id:"s123", ph:12, r:2, t:"Start the APs", ty:"code", lod:0, stage:"12.3", file:"arch/x86_64/smp/",
 what:"Wake the parked application processors, bring each through its own init, and hand it to the scheduler.",
 why:"The point where your OS uses the whole machine rather than a sixteenth of it.",
 next:["s126"]},

{id:"s126", ph:12, r:3, t:"TLB shootdown", ty:"concept", lod:1, stage:"12.6", file:"arch/x86_64/mm/tlb.cpp",
 what:"Unmapping a page on one core requires an inter-processor interrupt telling every other core to invalidate its cached translation.",
 why:"Skip it and another core keeps writing through a mapping you deleted.",
 trap:"This reproduces roughly never and corrupts silently. It is the single nastiest class of SMP bug.",
 next:["s131"]},

/* ---------- Phase 13 ---------- */
{id:"s131", ph:13, r:0, t:"File descriptors", ty:"code", lod:1, stage:"13.1", file:"fs/fd.cpp",
 what:"A per-process table mapping small integers to open file objects, with the 0, 1, 2 convention for stdin, stdout and stderr.",
 why:"The indirection that makes redirection and pipes possible at all.",
 next:["s132"]},

{id:"s132", ph:13, r:1, t:"fork", ty:"code", lod:0, stage:"13.2", file:"syscall/sys_fork.cpp",
 what:"Duplicate the calling process: copy the address space, the file descriptor table and the register state, then return 0 in the child and the child's PID in the parent.",
 why:"The strangest and most elegant idea in Unix — one call that returns twice.",
 next:["s133"]},

{id:"s133", ph:13, r:2, t:"Copy-on-write", ty:"concept", lod:0, stage:"13.3", file:"mm/vmm.cpp",
 what:"Do not copy pages at fork. Mark them read-only in both processes and copy a page only when one of them writes to it.",
 why:"fork immediately followed by exec is the common case, and copying the whole address space just to throw it away would be enormously wasteful. The page-fault handler you wrote in Phase 2 becomes a memory-management tool.",
 next:["s134"]},

{id:"s134", ph:13, r:3, t:"exec", ty:"code", lod:1, stage:"13.4", file:"syscall/sys_exec.cpp",
 what:"Replace the current process image with a new program: tear down the old address space, load the ELF, set up argv and envp, jump to the new entry point.",
 why:"fork plus exec is how every program on a Unix system is started.",
 next:["s136"]},

{id:"s136", ph:13, r:4, t:"Pipes & signals", ty:"code", lod:1, stage:"13.6-13.7", file:"fs/pipe.cpp, sched/signal.cpp",
 what:"A pipe is a bounded in-memory buffer with a read end and a write end. Signals are asynchronous notifications delivered by manipulating the target's saved user context.",
 why:"Pipes make composition possible. Signals make Ctrl-C work.",
 next:["s141"]},

/* ---------- Phase 14 ---------- */
{id:"s141", ph:14, r:0, t:"NIC driver", ty:"code", lod:1, stage:"14.1-14.3", file:"drivers/net/",
 what:"Ring buffers of descriptors the card DMAs frames into, plus an interrupt when something arrives. virtio-net for QEMU, e1000 for real hardware.",
 why:"The wire is just another device, but its data arrives unsolicited — which shapes everything above it.",
 next:["s144"]},

{id:"s144", ph:14, r:1, t:"Packet buffers", ty:"concept", lod:2, stage:"14.4", file:"net/pbuf.cpp",
 what:"A buffer with reserved headroom in front of the data so each layer can prepend its header without copying the payload again.",
 why:"Copying at every layer would dominate the cost of networking.",
 next:["s145"]},

{id:"s145", ph:14, r:2, t:"Ethernet & ARP", ty:"code", lod:1, stage:"14.5", file:"net/arp.cpp",
 what:"Frame headers with an ethertype that says what is inside, and ARP to map an IP address to a MAC address, with a cache.",
 why:"Every layer of a network stack is a switch statement on one field. This is the first one.",
 next:["s146"]},

{id:"s146", ph:14, r:3, t:"IPv4 & ICMP", ty:"code", lod:1, stage:"14.6", file:"net/ipv4.cpp",
 what:"Header parsing, checksum validation, routing decisions, and echo reply.",
 why:"ICMP echo is the first thing that talks back. Answering a ping from another machine is a genuinely emotional moment.",
 next:["s148"]},

{id:"s148", ph:14, r:4, t:"TCP", ty:"code", lod:0, stage:"14.8-14.9", file:"net/tcp.cpp",
 what:"The full connection state machine from LISTEN through TIME_WAIT, sequence numbers, the sliding window, retransmission and round-trip estimation.",
 why:"The hardest single subsystem in the project, and the one that turns a toy stack into something real programs can use.",
 next:["s151"]},

/* ---------- Phase 15 ---------- */
{id:"s151", ph:15, r:0, t:"W^X and NX", ty:"concept", lod:1, stage:"15.1", file:"mm/vmm.cpp",
 what:"No page is ever both writable and executable. The NX bit in the page table entry enforces it in hardware.",
 why:"Stops an attacker writing shellcode into a buffer and jumping to it. This is why Stage 0.4 aligned sections to 4 KiB.",
 next:["s152"]},

{id:"s152", ph:15, r:1, t:"SMEP & SMAP", ty:"concept", lod:1, stage:"15.2", file:"cpu/cr.cpp",
 what:"SMEP stops the kernel executing user pages. SMAP stops it even reading them without an explicit stac/clac window.",
 why:"Together they kill an entire class of privilege-escalation bug where a kernel pointer is quietly redirected into user memory.",

B["pwr"] = {
  what: `A CPU has no idea what an operating system is. It has a reset state and one address. When the power supply asserts its "power good" line, the chipset releases exactly one core from reset — the bootstrap processor, or BSP — and every other core stays parked in a wait state called wait-for-SIPI, executing nothing at all. The released core does not start at address zero. Its registers come up holding values fixed by the instruction-set manual, and those values add up to one linear address, 0xFFFFFFF0, sixteen bytes below the 4 GiB ceiling. That address is the reset vector, and the motherboard's address decoder routes it to an SPI flash chip soldered to the board, not to your DRAM, which at this instant is untrained and holds nothing meaningful.`,
  why: `Every bootstrap problem has the same shape: one immovable fact that everything else stands on. If the reset vector were configurable, the setting would live in some storage that itself needs finding, and finding it needs code, and that code needs an address. The recursion has to stop, so hardware stops it by fixing one address forever. Without a hardwired first fetch aimed at ROM, a powered-on x86 machine would execute whatever noise happens to be in an uninitialised DRAM cell.`,
  spec: [
    ["Reset vector (linear)", "0xFFFFFFF0"],
    ["CS selector at reset", "0xF000"],
    ["CS hidden base at reset", "0xFFFF0000 — NOT selector x 16"],
    ["IP at reset", "0xFFF0 (base + IP = 0xFFFFFFF0)"],
    ["Mode at reset", "16-bit real mode, segment x 16 + offset, 1 MiB reach"],
    ["CR0 at reset", "0x60000010 — PE=0, PG=0, ET=1, CD=1, NW=1 (Intel SDM Vol 3A, Table 9-1)"],
    ["RFLAGS at reset", "0x00000002 — bit 1 always set, IF=0, so no interrupt can divert"],
    ["EFER at reset", "0 — LME=0, long mode not even armed"],
    ["Budget at the vector", "16 bytes: 0xFFFFFFF0 to 0xFFFFFFFF inclusive"],
    ["Other cores", "held in wait-for-SIPI; they execute nothing until Phase 12"]
  ],
  code: `bits 16
; ---------------------------------------------------------------------------
; What physically sits at the reset vector, inside the SPI flash chip.
; State the hardware guarantees at the very first instruction fetch:
;   CS selector = 0xF000   CS hidden base = 0xFFFF0000   IP = 0xFFF0
;   linear = 0xFFFF0000 + 0xFFF0 = 0xFFFFFFF0
;   CR0 = 0x60000010 (PE=0, PG=0)      RFLAGS = 0x00000002 (IF=0)
;   No DRAM. No stack. No calls. No BIOS services - they do not exist yet.
; ---------------------------------------------------------------------------

section .reset_vector           ; the firmware build places this last in the ROM

reset_entry:
    cli                         ; belt and braces; IF is already 0 at reset
    jmp     0xF000:rom_body     ; far jump: reloads CS, base becomes 0x000F0000
                                ; the ROM is aliased into that legacy window too

    ; 0xFFFFFFF0 .. 0xFFFFFFFF is sixteen bytes. That is the entire budget,
    ; which is why the first instruction is always a jump somewhere roomier.
    times 16 - ($ - reset_entry) db 0xFF`,

    ["cli", "Redundant but honest: IF is already 0 out of reset. It documents the rule that no interrupt may divert this code, because there is no handler and no stack to push a frame onto."],
    ["jmp 0xF000:rom_body", "A far jump — a jump that reloads CS. It is the only sensible thing to put here because sixteen bytes is one instruction. The new CS base is 0xF000 x 16 = 0x000F0000, the legacy ROM window the chipset also aliases to flash."],

B["fw"] = {
  what: `Firmware is a program burned into flash on the motherboard that owns the machine from reset until it hands control to something on a disk. It is not part of your OS, you do not ship it, and you cannot debug it. Its job in order is POST (power-on self test), memory training so DRAM becomes usable, chipset and bus initialisation, PCI enumeration so devices get address ranges assigned, and then one final act: find something bootable and run it. There are two families of rules for that last act, and they share almost nothing. Legacy BIOS, from the 1981 IBM PC, reads 512 raw bytes and checks two of them; UEFI, from 2005, mounts a filesystem and loads a named file.`,
  why: `Firmware exists because a kernel cannot bring up its own RAM, and because somebody has to define what "bootable" means in a way a disk manufacturer and an OS author can both obey without ever talking. What it hands you is deliberately minimal: 512 bytes of 16-bit code, or one file. Without that contract there is no path from a powered core to any program you wrote. Note what it does not do — it has no idea it is booting an operating system, cannot parse ELF, and will not hand over in the CPU mode a 64-bit kernel needs. That leftover gap is exactly the bootloader's job.`,
  spec: [
    ["BIOS: what it reads", "LBA 0 — the first 512-byte block of the device"],
    ["BIOS: where it loads it", "physical 0x7C00, then jumps there in 16-bit real mode"],
    ["BIOS: the signature", "byte 510 = 0x55, byte 511 = 0xAA (NASM: dw 0xAA55, little-endian)"],
    ["BIOS: usable code bytes", "446 — 512 minus a 64-byte partition table minus the 2-byte signature"],
    ["BIOS: register on entry", "DL = the drive number it booted from; nothing else is promised"],
    ["UEFI: partition it hunts for", "GPT type GUID C12A7328-F81F-11D2-BA4B-00A0C93EC93B"],
    ["UEFI: ESP filesystem", "FAT12/16/32 only — the firmware ships no other filesystem driver"],
    ["UEFI: fallback path", "/EFI/BOOT/BOOTX64.EFI on x86_64, exactly that path and spelling"],
    ["UEFI: executable format", "PE32+ (COFF), subsystem = EFI application"],
    ["UEFI: CPU mode at handover", "64-bit long mode already, with boot services live"]

  code: `; The 512 bytes a legacy BIOS reads from LBA 0 and jumps to at 0x7C00.
; Assemble with:  nasm -f bin boot.asm -o boot.bin   (exactly 512 bytes out)
bits 16
org 0x7C00                      ; tell NASM where these bytes will live

start:
    cli                         ; no IDT we trust; set up segments first
    xor     ax, ax
    mov     ds, ax              ; DS = ES = SS = 0 so offsets are linear-ish
    mov     es, ax
    mov     ss, ax
    mov     sp, 0x7C00          ; stack grows DOWN, away from our own code
    sti
    mov     dh, dl              ; BIOS left the boot drive number in DL - keep it

    mov     si, msg
.print:
    lodsb                       ; AL = [DS:SI], SI++
    test    al, al
    jz      .chain
    mov     ah, 0x0E            ; INT 10h, teletype output
    int     0x10
    jmp     .print

.chain:
    ; A real first stage now calls INT 13h with DH's drive number to pull in
    ; stage two. 446 bytes is not enough for anything else. This is why every
    ; BIOS bootloader is a chain of stages, Limine included.
    jmp     $

msg: db "stage 1", 0

    dw 0xAA55                   ; byte 510 = 0x55, byte 511 = 0xAA`,

B["limine"] = {
  what: `Limine is a bootloader: the program that fills the gap between what firmware can load and what a kernel needs to run. Firmware can read 512 raw bytes, or one PE32+ file from a FAT partition. Our kernel is an ELF64 executable that must be placed at specific virtual addresses, in 64-bit long mode, with paging on, a stack, and knowledge of where RAM and the screen are. Limine closes that entire gap in one program that ships in both flavours — BIOS stages and BOOTX64.EFI — so both firmware families converge on identical kernel entry conditions. End to end it parses limine.conf, reads kernel.elf and initrd.tar off the boot volume, places each PT_LOAD segment at the address its program header demands, sets a graphics mode, calls ExitBootServices on UEFI, builds four levels of page tables including the higher-half direct map, climbs whatever remains of the real to protected to long mode ladder, scans the loaded kernel image for request magic and writes every response pointer, then jumps to the ELF header's e_entry.`,

    uint64_t size;      // bytes
    char     path[64];  // copied, not aliased

bool collect_initrd(ModuleRecord* out) {
    const limine_module_response* r = g_module_request.response;
    if (r == nullptr || r->module_count == 0) return false;   // nothing staged

  what: `A tar archive is a flat sequence of 512-byte blocks. Every file in it is one 512-byte header block naming the file, followed by the file's bytes padded up with zeros to the next 512-byte boundary, and then the next header. There is no index, no directory, no free list — you find a file by walking from the front. USTAR is the standardised version of that layout, which is what GNU tar writes when you pass --format=ustar. Stage 7.2 writes a walker over the module bytes and exposes list, find and read; because the bytes live in module memory and nothing rewrites them, this first filesystem is strictly read-only. The shipped design then unpacks each entry into a writable tmpfs so files can be created and modified.`,

    ["magic / version", "offset 257 = \"ustar\" plus NUL; offset 263 = \"00\""],

#include <stdint.h>
#include <stddef.h>

struct UstarHeader {          // exactly 512 bytes, offsets fixed by the format
    char name[100];           //   0
    char mode[8]; char uid[8]; char gid[8];    // 100, 108, 116  all octal ASCII
    char size[12];            // 124  OCTAL ASCII. Not decimal. Not binary.
    char mtime[12];           // 136
    char chksum[8];           // 148
    char typeflag;            // 156  '0' or 0 = file, '5' = directory
    char linkname[100];       // 157
    char magic[6];            // 257  "ustar" + NUL
    char version[2];          // 263
    char uname[32]; char gname[32];            // 265, 297
    char devmajor[8]; char devminor[8];        // 329, 337
    char prefix[155];         // 345
    char pad[12];             // 500 -> 512
};
static_assert(sizeof(UstarHeader) == 512, "USTAR header must be exactly 512 bytes");

static uint64_t oct(const char* p, size_t n) {   // base 8, stops at space or NUL
    uint64_t v = 0;
    for (size_t i = 0; i < n && p[i] >= '0' && p[i] <= '7'; ++i)
        v = (v << 3) | uint64_t(p[i] - '0');
    return v;
}

void tar_walk(const uint8_t* base, uint64_t len,
              void (*visit)(const UstarHeader*, const uint8_t*, uint64_t)) {
    uint64_t off = 0;
    while (off + 512 <= len) {
        auto* h = reinterpret_cast<const UstarHeader*>(base + off);
        if (h->name[0] == '\\0') break;                  // zero block: end of archive
        const uint64_t size = oct(h->size, 12);
        if (off + 512 + size > len) break;              // truncated archive
        visit(h, base + off + 512, size);
        off += 512 + ((size + 511) & ~uint64_t(511));   // data rounded UP to 512
    }
}`,

Dentry* namei(const char* path, Dentry* cwd) {

        while (*path == '/') ++path;              // squash runs of slashes

    uint64_t p_offset, p_vaddr, p_paddr, p_filesz, p_memsz, p_align;

static constexpr uint32_t PT_LOAD = 1, PF_X = 1, PF_W = 2;
static constexpr uint64_t USER_MIN = 0x400000, USER_MAX = 0x00007FFFFFFFFFFFull;

// The entire hardware seam. Five operations, nothing else.
struct BlockDevice {
    uint32_t block_size;             // 512 on QEMU AHCI, often 4096 on NVMe
    uint64_t block_count;            // total addressable blocks
    uint32_t max_blocks_per_request; // driver-imposed cap on one transfer
    virtual int read_blocks (uint64_t lba, uint32_t n, void* dst)       = 0;
    virtual int write_blocks(uint64_t lba, uint32_t n, const void* src) = 0;
    virtual int flush()                                                 = 0;
};

// A partition is not a special case. It is a BlockDevice made of one.
struct PartitionDevice final : BlockDevice {
    BlockDevice* parent;
    uint64_t     start_lba;      // absolute LBA on the parent device
    uint64_t     length_blocks;  // GPT EndingLBA is inclusive: end - start + 1

    int read_blocks(uint64_t lba, uint32_t n, void* dst) override {
        if (lba + n > length_blocks) return -EIO;   // the only safety boundary
        return parent->read_blocks(start_lba + lba, n, dst);
    }
    int write_blocks(uint64_t lba, uint32_t n, const void* src) override {
        if (lba + n > length_blocks) return -EIO;
        return parent->write_blocks(start_lba + lba, n, src);
    }
    int flush() override { return parent->flush(); }
};

// The stub Phase 10 develops against while AHCI is still being written.
struct RamDiskDevice final : BlockDevice {
    uint8_t* base;
    int read_blocks(uint64_t lba, uint32_t n, void* dst) override {
        kmemcpy(dst, base + lba * block_size, (size_t)n * block_size); return 0; }
    int write_blocks(uint64_t lba, uint32_t n, const void* src) override {
        kmemcpy(base + lba * block_size, src, (size_t)n * block_size); return 0; }
    int flush() override { return 0; }   // nothing volatile below us
};`,

#include <stddef.h>

static constexpr uint64_t HHDM_BASE = 0xFFFF800000000000ULL;
static constexpr uint64_t PAGE_SIZE = 4096;

static inline uint64_t virt_to_phys(const void* v) {
    return reinterpret_cast<uint64_t>(v) - HHDM_BASE;
}
static inline void* phys_to_virt(uint64_t p) {
    return reinterpret_cast<void*>(p + HHDM_BASE);
}

// Phase 4 gave us alloc_frame(): ONE frame. DMA needs a RUN of frames.
// Scan the PMM bitmap for n consecutive free frames at the right alignment.
uint64_t pmm_alloc_contiguous(uint64_t n, uint64_t align_frames, uint64_t max_phys) {
    for (uint64_t base = 0; base + n <= pmm_frame_count; base += align_frames) {
        if ((base + n) * PAGE_SIZE > max_phys) return 0;   // CAP.S64A clear -> 4 GiB
        uint64_t k = 0;
        while (k < n && pmm_frame_is_free(base + k)) k++;
        if (k != n) continue;
        for (uint64_t i = 0; i < n; i++) pmm_mark_used(base + i);
        return base * PAGE_SIZE;
    }
    return 0;                                       // fragmented: fail, do not fake it

struct DmaRegion { void* virt; uint64_t phys; uint64_t bytes; };

DmaRegion dma_alloc(uint64_t bytes, uint64_t align_bytes, bool below_4g) {

    KASSERT((phys & (align_bytes - 1)) == 0);       // hardware will not tell you

    return DmaRegion{ v, phys, frames * PAGE_SIZE };

    ["Each buffer stores", "data (HHDM virtual pointer) and phys_addr (for the PRDT or PRP)"],

    uint32_t  disk_id;    // identity of the UNDERLYING disk, never a partition
    uint64_t  lba;        // ABSOLUTE lba on that disk
    void*     data;       // HHDM virtual pointer to one 4 KiB frame
    uint64_t  phys_addr;  // the same frame, physical - goes into a PRDT or a PRP
    uint32_t  flags;      // BUF_VALID | BUF_DIRTY | BUF_BUSY
    uint32_t  refcount;   // callers holding a pointer - NOT the same as BUSY
    Buffer*   hash_next;  Buffer* lru_prev;  Buffer* lru_next;
    WaitQueue waiters;
};

Buffer* bcache_get(uint32_t disk_id, uint64_t lba) {
    spin_lock_irqsave(&bc.lock);
    for (;;) {
        Buffer* b = hash_find(disk_id, lba);
        if (!b) break;
        if (b->flags & BUF_BUSY) { sleep_on(&b->waiters, &bc.lock); continue; }
        b->refcount++;
        lru_touch(b);                       // move to the MRU end
        spin_unlock_irqrestore(&bc.lock);
        return b;                                                     // HIT
    }
    Buffer* v = lru_victim();               // refcount == 0 && !(flags & BUF_BUSY)
    if (v->flags & BUF_DIRTY) {             // write back at the OLD key FIRST
        v->flags |= BUF_BUSY;
        spin_unlock_irqrestore(&bc.lock);
        disk_of(v->disk_id)->write_blocks(v->lba, BLOCKS_PER_BUF, v->data);
        spin_lock_irqsave(&bc.lock);
        v->flags &= ~(BUF_DIRTY | BUF_BUSY);
    }
    hash_remove(v);
    v->disk_id = disk_id;  v->lba = lba;
    v->flags = BUF_BUSY;   v->refcount = 1; // BUSY but not VALID: contents garbage
    hash_insert(v);
    spin_unlock_irqrestore(&bc.lock);
    disk_of(disk_id)->read_blocks(lba, BLOCKS_PER_BUF, v->data);  // BLOCKS here
    v->flags = (v->flags & ~BUF_BUSY) | BUF_VALID;
    wake_all(&v->waiters);
    return v;                                                         // MISS
}`,

// AHCI: one READ DMA EXT into command slot k.
void ahci_read(volatile HbaPort* p, int k, uint64_t lba,
               uint16_t sectors, uint64_t buf_phys, uint32_t bytes) {

    h->prdtl = 1;  h->prdbc = 0;  // the HBA writes the real byte count into prdbc
    FisH2D* f = reinterpret_cast<FisH2D*>(cmd_table[k]->cfis);

    f->command = 0x25;                   // READ DMA EXT
    f->device  = 1 << 6;                 // LBA mode, not CHS
    f->lba0 = lba; f->lba1 = lba >> 8;  f->lba2 = lba >> 16;
    f->lba3 = lba >> 24; f->lba4 = lba >> 32; f->lba5 = lba >> 40;

    p->ci = 1u << k;                          // issue slot k

    Dentry*     covered;    // dentry in the PARENT fs that this mount hides
    Superblock* sb;         // the filesystem being grafted in
    Dentry*     root;       // sb->s_root, cached
    uint32_t    flags;      // MNT_RDONLY, MNT_NOEXEC
    uint32_t    refcount;   Mount* next;
};
static Mount* mount_list;   // a handful of records; a linear scan is correct here
int do_mount(BlockDevice* dev, const char* fstype, Dentry* at, uint32_t flags) {
    FsType* t = find_fstype(fstype);
    if (!t) return -ENODEV;
    if (at != vfs_root && !S_ISDIR(at->inode->i_mode)) return -ENOTDIR;

    m->next = mount_list;  mount_list = m;

    return 0;

Dentry* follow_mounts(Dentry* d) {    // crossing down: a loop, because mounts stack

Dentry* parent_of(Dentry* d) {        // crossing up, for ".." - everyone gets this wrong
    Mount* m = mount_of_root(d);      // is d the ROOT of some mounted filesystem?
    if (m) d = m->covered;            // jump OUT before taking the parent
    return d->parent ? d->parent : d; // "/" is its own parent
}
int do_umount(Dentry* at) {
    Mount* m = lookup_mount(at);
    if (!m) return -EINVAL;
    if (m->sb->open_inodes || m->refcount > 1) return -EBUSY;

    at->d_is_mountpoint = false;

static uint32_t fat_entry_sector(const Bpb& b, uint32_t n) {

// Follow the chain one link. Returns 0 when the file ends.
uint32_t fat32_next(Fat32* fs, uint32_t cluster) {

                             fs->part_lba + fat_entry_sector(fs->bpb, cluster));
    uint32_t off = (cluster * 4) % fs->bpb.byts_per_sec;
    uint32_t v = le32((uint8_t*)buf->data + off) & 0x0FFFFFFF;  // top 4 bits reserved
    bcache_release(buf);
    if (v < 2 || v == FAT_BAD || v >= FAT_EOC_MIN) return 0;
    return v;
}
// Write a link. The read-modify-write is not optional.
void fat32_set(Fat32* fs, uint32_t cluster, uint32_t value) {
    Buffer* buf = bcache_get(fs->disk_id,

    uint8_t* p = (uint8_t*)buf->data + (cluster * 4) % fs->bpb.byts_per_sec;

    buf->flags |= BUF_DIRTY;
    bcache_release(buf);

#include <stddef.h>

struct acpi_sdt {                 // 36 bytes, every table starts with this
    char     signature[4];
    uint32_t length;              // whole table, header included
    uint8_t  revision;
    uint8_t  checksum;            // all length bytes sum to zero
    char     oem_id[6];
    char     oem_table_id[8];
    uint32_t oem_revision;
    uint32_t creator_id;
    uint32_t creator_revision;
} __attribute__((packed));

static bool sums_to_zero(const void* p, size_t n) {
    const uint8_t* b = static_cast<const uint8_t*>(p);
    uint8_t s = 0;
    for (size_t i = 0; i < n; ++i) s = uint8_t(s + b[i]);
    return s == 0;
}
// g_rsdp_phys comes from limine_rsdp_response.address. hhdm() adds the offset.
const acpi_sdt* acpi_find(const char* sig) {
    const uint8_t* r = static_cast<const uint8_t*>(hhdm(g_rsdp_phys));
    if (__builtin_memcmp(r, "RSD PTR ", 8) != 0) panic("bad RSDP signature");
    if (!sums_to_zero(r, 20)) panic("RSDP v1 checksum");
    const bool xsdt = r[15] >= 2;
    uint64_t root = xsdt ? *(const uint64_t*)(r + 24) : *(const uint32_t*)(r + 16);
    auto* h = static_cast<const acpi_sdt*>(hhdm(root));
    const size_t stride = xsdt ? 8 : 4;
    const size_t n = (h->length - sizeof(acpi_sdt)) / stride;
    for (size_t i = 0; i < n; ++i) {
        const uint8_t* e = reinterpret_cast<const uint8_t*>(h + 1) + i * stride;
        uint64_t phys = xsdt ? *(const uint64_t*)e : *(const uint32_t*)e;
        auto* t = static_cast<const acpi_sdt*>(hhdm(phys));
        if (__builtin_memcmp(t->signature, sig, 4) == 0 && sums_to_zero(t, t->length))

static inline uint32_t pci_cfg_read32(uint8_t bus, uint8_t dev, uint8_t fn, uint8_t off) {

                        | (uint32_t(fn) << 8) | (off & 0xFCu);
    outl(0xCF8, addr);            // index/data protocol: a global two-register lock
    return inl(0xCFC);
}

struct pci_dev { uint8_t bus, dev, fn; uint16_t vendor, device;
                 uint8_t class_code, subclass, prog_if; };
void pci_scan(void (*found)(const pci_dev&)) {
    for (uint16_t bus = 0; bus < 256; ++bus)
      for (uint8_t dev = 0; dev < 32; ++dev) {
        const uint32_t id0 = pci_cfg_read32(bus, dev, 0, 0x00);
        if ((id0 & 0xFFFF) == 0xFFFF) continue;            // nothing here
        const uint8_t hdr = uint8_t(pci_cfg_read32(bus, dev, 0, 0x0C) >> 16);
        const uint8_t nfn = (hdr & 0x80) ? 8 : 1;          // multi-function bit
        for (uint8_t fn = 0; fn < nfn; ++fn) {
            const uint32_t id = pci_cfg_read32(bus, dev, fn, 0x00);
            if ((id & 0xFFFF) == 0xFFFF) continue;
            const uint32_t cls = pci_cfg_read32(bus, dev, fn, 0x08);
            pci_dev d { uint8_t(bus), dev, fn, uint16_t(id), uint16_t(id >> 16),
                        uint8_t(cls >> 24), uint8_t(cls >> 16), uint8_t(cls >> 8) };
            found(d);
        }
      }
}
uint64_t pci_bar_addr_and_size(const pci_dev& d, int i, uint64_t* size_out) {
    const uint8_t off = uint8_t(0x10 + i * 4);
    const uint32_t lo = pci_cfg_read32(d.bus, d.dev, d.fn, off);
    uint64_t base = lo & ~0xFull;                          // memory BAR: mask 4 bits
    if (((lo >> 1) & 3) == 2)                              // 64-bit BAR: BAR i+1 is the high half
        base |= uint64_t(pci_cfg_read32(d.bus, d.dev, d.fn, uint8_t(off + 4))) << 32;
    pci_cfg_write32(d.bus, d.dev, d.fn, off, 0xFFFFFFFFu);

    pci_cfg_write32(d.bus, d.dev, d.fn, off, lo);          // ALWAYS restore
    *size_out = (~(probe & ~0xFu)) + 1;
    return base;
}`,

static inline void     lapic_write(uint32_t off, uint32_t v) { g_lapic[off / 4] = v; }

void lapic_init() {

    uint64_t base = rdmsr(0x1B);

    lapic_write(0x080, 0);                       // TPR = 0: accept every priority
    lapic_write(0x0F0, 0x100 | 0xFF);            // bit 8 software enable, spurious vec 0xFF

static inline void lapic_eoi() { lapic_write(0x0B0, 0); }

// I/O APIC: an index/data pair, exactly like PCI config space.
static volatile uint32_t* g_ioapic;
static uint32_t ioapic_read(uint32_t reg) { g_ioapic[0] = reg; return g_ioapic[4]; }

// gsi comes from the MADT: ISA IRQ 0 is often GSI 2 via an interrupt source override.
void ioapic_route(uint32_t gsi, uint8_t vector, uint8_t dest_apic_id, bool active_low, bool level) {

    ioapic_write(idx + 1, uint32_t(e >> 32));    // write HIGH half first
    ioapic_write(idx,     uint32_t(e));          // the low write unmasks it (bit 16 clear)

  what: `A kernel needs two different clocks and they are not interchangeable. A monotonic clock counts elapsed time and never goes backwards; it is what timeouts, scheduling quanta, and TCP round-trip estimation use. A wall clock says what the date is; it is what file timestamps use and it is allowed to jump when someone corrects it. The HPET (High Precision Event Timer) is a memory-mapped free-running counter whose tick period the firmware reports in femtoseconds, so it is a known-rate reference. The TSC (Time Stamp Counter) is a per-core register read by the rdtsc instruction that counts CPU cycles — fast, but it counts cycles, not seconds, so you must calibrate it against the HPET at boot. The RTC is a battery-backed clock behind the CMOS index/data ports that gives you the actual date.`,

static volatile uint64_t* g_hpet;    // uncacheable mapping of the HPET base
static uint64_t g_tsc_hz;            // filled in by calibrate_tsc()

static inline uint64_t hpet_now() { return g_hpet[0x0F0 / 8]; }
static inline uint64_t rdtsc() {
    uint32_t lo, hi;
    asm volatile("rdtsc" : "=a"(lo), "=d"(hi));
    return (uint64_t(hi) << 32) | lo;
}

void calibrate_tsc() {
    const uint32_t period_fs = uint32_t(g_hpet[0x000 / 8] >> 32);  // fs per HPET tick
    g_hpet[0x010 / 8] |= 1;                                        // ENABLE_CNF
    const uint64_t ticks_10ms = 10000000000000ull / period_fs;     // 10 ms in HPET ticks

    const uint64_t t1 = rdtsc(), h1 = hpet_now();

    const uint64_t elapsed_fs = (h1 - h0) * period_fs;
    g_tsc_hz = (t1 - t0) * 1000000000000000ull / elapsed_fs;       // cycles per second

void smp_start_aps(const boot_info_t& bi) {

        pc->self_addr = uint64_t(pc);
        pc->cpu_index = i;
        pc->lapic_id  = bi.cpus[i]->lapic_id;
        pc->online.store(false, __ATOMIC_RELAXED);
        gdt_build_for(i);
        tss_build_for(i, kstack_alloc(), ist_alloc());
        pc->idle = idle_task_create(i);

        bi.cpus[i]->extra_argument = i;            // how the AP learns its index
        __atomic_store_n(&bi.cpus[i]->goto_address, &ap_entry, __ATOMIC_RELEASE);
    }
    for (uint32_t i = 0; i < bi.cpu_count; ++i) {  // the barrier
        uint64_t spins = 0;
        while (!percpu_of(i)->online.load(__ATOMIC_ACQUIRE))
            if (++spins > SMP_START_TIMEOUT) panic("cpu %u never came online", i);

// AP side. The first instruction of our code this core has ever executed.
extern "C" [[noreturn]] void ap_entry(limine_smp_info* info) {
    PerCpu* pc = percpu_of(uint32_t(info->extra_argument));

  what: `The TLB (translation lookaside buffer) is a small cache inside each core holding recent virtual-to-physical translations so the CPU does not walk four levels of page tables on every access. Unlike the data caches, it is not coherent: nothing in the hardware notices that you edited a page table entry. The core that made the edit invalidates its own entry with the invlpg instruction; every other core keeps using its stale translation until told otherwise. There is no way to reach into a remote core's TLB, so the only mechanism available is to interrupt it and ask. That interrupt is an inter-processor interrupt on a dedicated vector, and the whole sequence — edit, invalidate locally, IPI the cores that share this address space, wait for acknowledgements, then free the frame — is called a TLB shootdown.`,

struct ShootdownRequest {
    uint64_t start_addr;
    uint64_t page_count;
    uint64_t cr3_target;
    kstd::atomic<uint32_t> pending_acks;
};

// Called with the AddressSpace table_lock held, AFTER the PTE has been cleared.
void tlb_shootdown(AddressSpace& as, uint64_t va, uint64_t pages) {
    for (uint64_t i = 0; i < pages; ++i)
        asm volatile("invlpg (%0)" :: "r"(va + i * 4096) : "memory");  // local half

    uint64_t mask = as.active_cpu_mask & ~(1ull << this_cpu()->cpu_index);
    if (mask == 0) return;                       // nobody else has this address space

    ShootdownRequest req;
    req.start_addr = va; req.page_count = pages; req.cr3_target = as.cr3_phys;
    req.pending_acks.store(__builtin_popcountll(mask), __ATOMIC_RELAXED);
    for (uint32_t c = 0; c < g_cpu_count; ++c) {
        if (!(mask & (1ull << c))) continue;
        percpu_of(c)->shootdown = &req;          // publish the mailbox...
        ipi_send(percpu_of(c)->lapic_id, 0xF0);  // ...then ring the doorbell
    }
    // Interrupts stay ENABLED here, and we service our own mailbox while waiting.
    while (req.pending_acks.load(__ATOMIC_ACQUIRE) != 0) {
        tlb_service_pending();                   // the anti-deadlock line
        __builtin_ia32_pause();
    }
}
extern "C" void tlb_shootdown_isr() {            // IDT vector 0xF0
    ShootdownRequest* r = this_cpu()->shootdown;
    if (r && read_cr3() == r->cr3_target)
        for (uint64_t i = 0; i < r->page_count; ++i)
            asm volatile("invlpg (%0)" :: "r"(r->start_addr + i * 4096) : "memory");
    this_cpu()->shootdown = nullptr;
    r->pending_acks.fetch_sub(1, __ATOMIC_RELEASE);
    lapic_eoi();
}`,

// Called from the Phase 2 page fault handler when err has P=1, W=1, U=1.
bool cow_fault(AddressSpace& as, uint64_t fault_va) {

struct Pipe {
    uint8_t  buf[PIPE_SIZE];
    uint32_t head = 0, tail = 0;        // tail - head is the byte count

    Spinlock lock; WaitQueue rq, wq;

long pipe_read(Pipe* p, void* kbuf, uint64_t len) {
    IrqSpinGuard g(p->lock);
    while (p->head == p->tail) {                 // empty
        if (p->writers == 0) return 0;           // EOF: every writer closed
        if (signal_pending(current())) return -EINTR;
        wait_on(p->rq, p->lock);                 // drops the lock, sleeps, retakes it

    uint64_t n = min(len, uint64_t(p->tail - p->head));
    ring_copy_out(p, kbuf, n); p->head += uint32_t(n);
    wake_all(p->wq); return long(n);             // a blocked writer may now proceed

long pipe_write(Pipe* p, const void* kbuf, uint64_t len) {

        if (p->readers == 0) { send_signal(current(), SIGPIPE); return -EPIPE; }
        wait_on(p->wq, p->lock);

    if (p->readers == 0) { send_signal(current(), SIGPIPE); return -EPIPE; }
    uint64_t n = min(len, uint64_t(PIPE_SIZE - (p->tail - p->head)));
    ring_copy_in(p, kbuf, n); p->tail += uint32_t(n);
    wake_all(p->rq);
    return long(n);

void deliver_signal(Task* t, int sig, SyscallFrame* f) {

struct ipv4_hdr {
    uint8_t  ver_ihl, dscp_ecn; uint16_t total_len, id, flags_frag;

} __attribute__((packed));
struct icmp_hdr { uint8_t type, code; uint16_t checksum, id, seq; } __attribute__((packed));
uint16_t inet_checksum(const void* p, uint32_t len) {
    const uint16_t* w = static_cast<const uint16_t*>(p); uint32_t sum = 0;
    for (; len > 1; len -= 2) sum += *w++;
    if (len) sum += *reinterpret_cast<const uint8_t*>(w);   // odd trailing byte
    while (sum >> 16) sum = (sum & 0xFFFF) + (sum >> 16);   // end-around carry
    return uint16_t(~sum);
}
void ipv4_input(NetDevice* d, pkt_buf* p) {
    if (p->len() < sizeof(ipv4_hdr)) { pkt_free(p); return; }
    auto* ip = reinterpret_cast<ipv4_hdr*>(p->data);
    const uint32_t ihl = (ip->ver_ihl & 0x0F) * 4u;
    if ((ip->ver_ihl >> 4) != 4 || ihl < 20 || ihl > p->len()) { pkt_free(p); return; }
    if (inet_checksum(ip, ihl) != 0) { pkt_free(p); return; }   // valid sums to zero
    const uint32_t total = ntohs(ip->total_len);
    if (total < ihl || total > p->len()) { pkt_free(p); return; }  // never trust it
    p->tail = p->data + total;                              // drop Ethernet padding
    if (ip->dst != d->ipv4 && ip->dst != 0xFFFFFFFFu) { pkt_free(p); return; }
    const uint8_t proto = ip->protocol; const uint32_t src = ip->src;
    pkt_pull(p, ihl);                            // strip exactly this layer, once
    switch (proto) {
        case 1:  icmp_input(d, p, src); break;
        case 6:  tcp_input(d, p, src);  break;
        case 17: udp_input(d, p, src);  break;
        default: pkt_free(p);           break;   // every path frees exactly once
    }
}
void icmp_input(NetDevice* d, pkt_buf* p, uint32_t src) {
    if (p->len() < sizeof(icmp_hdr)) { pkt_free(p); return; }
    auto* ic = reinterpret_cast<icmp_hdr*>(p->data);
    if (ic->type != 8 || inet_checksum(ic, p->len()) != 0) { pkt_free(p); return; }
    ic->type = 0; ic->checksum = 0;               // echo request becomes echo reply
    ic->checksum = inet_checksum(ic, p->len());   // payload reused byte for byte

static inline bool seq_lt(uint32_t a, uint32_t b) { return int32_t(a - b) <  0; }
static inline bool seq_le(uint32_t a, uint32_t b) { return int32_t(a - b) <= 0; }

struct Tcb {                             // RFC 9293 names, so the RFC reads as docs

    uint32_t cwnd, ssthresh, srtt, rttvar, rto;   // the last three in milliseconds
    TcpState state;

// RFC 6298. Karn: never sample from a retransmitted segment.
void tcp_rtt_sample(Tcb& t, uint32_t r_ms) {
    if (t.srtt == 0) { t.srtt = r_ms; t.rttvar = r_ms / 2; }
    else {
        const uint32_t err = (t.srtt > r_ms) ? t.srtt - r_ms : r_ms - t.srtt;
        t.rttvar = (3 * t.rttvar + err) / 4;   // 0.75 old + 0.25 error

    t.rto = clamp(t.srtt + 4 * t.rttvar, RTO_MIN_MS, RTO_MAX_MS);

// How much we may send right now: the SMALLER of the two windows.
uint32_t tcp_usable_window(const Tcb& t) {
    const uint32_t right = t.snd_una + min(t.snd_wnd, t.cwnd);
    return seq_lt(t.snd_nxt, right) ? (right - t.snd_nxt) : 0;

void tcp_on_ack(Tcb& t, uint32_t ack) {
    if (seq_le(ack, t.snd_una) || seq_lt(t.snd_nxt, ack)) return;  // old or impossible

    else                     t.cwnd += MSS * MSS / t.cwnd;         // congestion avoidance

// With entry.cpp, the ONLY files in the tree that may include limine.h.
#include <kernel/boot_info.hpp>
#include "limine.h"

// Defined (not static) in entry.cpp. The volatile qualifier must match there
// exactly: globals are not mangled, so a mismatch links silently and misreads.
extern volatile limine_memmap_request memmap_request;
extern volatile limine_hhdm_request   hhdm_request;

static BootInfo g_boot_info;   // .bss: trivially constructible, arrives zeroed

[[noreturn]] void boot_halt(uint64_t code) {
    __asm__ volatile("cli" ::: "memory");
    // "D" pins code in RDI, inside the loop so it cannot be optimised dead.
    for (;;) __asm__ volatile("hlt" :: "D"(code) : "memory");
}

BootInfo* collect_boot_info() {
    BootInfo& bi = g_boot_info;

    limine_memmap_response* mm = memmap_request.response;
    if (mm == nullptr)                 boot_halt(BOOT_FAIL_NO_MEMMAP);
    if (mm->entry_count == 0)          boot_halt(BOOT_FAIL_EMPTY_MEMMAP);
    if (mm->entry_count > MAX_REGIONS) boot_halt(BOOT_FAIL_TOO_MANY_REGIONS);

    for (uint64_t i = 0; i < mm->entry_count; ++i) {
        const limine_memmap_entry* e = mm->entries[i];  // array of POINTERS
        bi.regions[i].base     = e->base;
        bi.regions[i].length   = e->length;
        bi.regions[i].type     = map_memory_type(e->type);  // explicit switch
        bi.regions[i].reserved = 0;
    }
    bi.region_count = static_cast<size_t>(mm->entry_count);

    limine_hhdm_response* hhdm = hhdm_request.response;
    if (hhdm == nullptr) boot_halt(BOOT_FAIL_NO_HHDM);
    bi.hhdm_offset = static_cast<uintptr_t>(hhdm->offset);

    // Module path strings are in reclaimable memory too: copy_string() them.
    return &bi;   // from here on, the bootloader's memory is dead to us
}`,

B["s04"] = {
  what: `The linker script is a placement program. It tells the linker which input sections from which object files go into which output sections, at which addresses, and — through PHDRS — which ELF program headers (segments) those output sections belong to. Segments are what a loader actually reads: each PT_LOAD segment has a virtual address, a file size, a memory size, and permission bits, and Limine maps exactly that. The kernel is placed at 0xFFFFFFFF80000000, the bottom of the topmost 2 GiB. Every region boundary is rounded up to 4 KiB because page-table entries carry one writable bit and one no-execute bit per 4 KiB page.`,

    ["KERNEL_VMA", "0xFFFFFFFF80000000 — sixteen hex digits"],
    ["Reach of a sign-extended 32-bit field", "0x0..0x7FFFFFFF and 0xFFFFFFFF80000000..0xFFFFFFFFFFFFFFFF"],
    ["PHDRS FLAGS bits", "PF_X=1, PF_W=2, PF_R=4; used: 6=RW, 5=R E, 4=R. 7=RWX must never appear"],

    ["KERNEL_STACK_SIZE", "64 KiB, plus one 4 KiB guard page below it, both NOBITS"],

OUTPUT_FORMAT(elf64-x86-64)
OUTPUT_ARCH(i386:x86-64)
ENTRY(kmain)

KERNEL_VMA        = 0xFFFFFFFF80000000;    /* required by -mcmodel=kernel */
PAGE_SIZE         = CONSTANT(MAXPAGESIZE); /* 0x1000 given the -z flag    */
KERNEL_STACK_SIZE = 64K;

PHDRS {                          /* FLAGS: PF_X=1 PF_W=2 PF_R=4 */
    requests PT_LOAD FLAGS(6);   /* RW  - the bootloader writes here */
    text     PT_LOAD FLAGS(5);   /* R E */
    rodata   PT_LOAD FLAGS(4);   /* R   */
    data     PT_LOAD FLAGS(6);   /* RW  */

SECTIONS {
    . = KERNEL_VMA;
    __kernel_start = .;
    /* Nothing references these; Limine finds them by scanning for magic. */
    .limine_requests : {
        KEEP(*(.limine_requests_start))
        KEEP(*(.limine_requests))
        KEEP(*(.limine_requests_end))
    } :requests
    . = ALIGN(PAGE_SIZE);
    .text   : { __text_start   = .; *(.text .text.*)     } :text
    . = ALIGN(PAGE_SIZE);   __text_end = .;
    .rodata : { __rodata_start = .; *(.rodata .rodata.*) } :rodata
    . = ALIGN(PAGE_SIZE);   __rodata_end = .;
    __data_start = .;
    .init_array : { __init_array_start = .;
        KEEP(*(SORT_BY_INIT_PRIORITY(.init_array.*))) KEEP(*(.init_array))
        __init_array_end = .; } :data
    .data : { *(.data .data.*) } :data
    . = ALIGN(PAGE_SIZE);   __data_end = .;
    /* .bss LAST in :data, so p_memsz > p_filesz and the loader zero-fills. */
    .bss : {
        __bss_start = .;  *(.bss .bss.*)  *(COMMON)
        . = ALIGN(PAGE_SIZE);
        __stack_guard_bottom = .; . = . + PAGE_SIZE; __stack_guard_top = .;
        __stack_bottom = .; . = . + KERNEL_STACK_SIZE; __stack_top = .;
    } :data
    . = ALIGN(PAGE_SIZE);   __bss_end = .;   __kernel_end = .;
    /DISCARD/ : { *(.eh_frame .eh_frame.*) *(.note .note.*) *(.comment) }

B["s05"] = {

B["s06"] = {
  what: `A UART (universal asynchronous receiver/transmitter) is a chip that turns a byte into a sequence of voltage levels on one wire and back again. The PC's is a 16550, and it is reached through the x86 I/O port space — a second, separate 65536-address space that no C++ pointer can name and only the in and out instruction families can touch. COM1 lives at port 0x3F8, with eight one-byte registers at offsets 0 through 7. Two of those offsets have two completely different meanings depending on bit 7 of the Line Control Register, the DLAB bit, which is what makes the initialisation sequence look strange. Transmitting is polled: read the Line Status Register at offset 5, wait for bit 5, then write the byte to offset 0.`,
  why: `This is the first output of any kind. Until now the only evidence a kernel ran was a register value read from outside the machine. Serial arrives before the framebuffer console because it needs no memory manager, no interrupts, no fonts and no allocations — which is exactly why the panic handler in Stage 0.7 uses it, and why it keeps working when everything else is broken. On real hardware a serial line is also the only channel that survives a machine that has stopped drawing.`,
  spec: [
    ["COM1 base", "0x3F8 (COM2 0x2F8, COM3 0x3E8, COM4 0x2E8)"],
    ["Offsets 0 and 1", "DLAB=0: RBR/THR and IER. DLAB=1: divisor latch low and high"],
    ["Offsets 2,3,4,5", "FCR (write-only), LCR, MCR, LSR (read-only)"],
    ["LCR 0x03", "8 data bits, 1 stop bit, no parity — 8N1. LCR bit 7 = DLAB"],
    ["LSR bit 5 (0x20) / bit 0 (0x01)", "THR empty, safe to write offset 0 / data ready in RBR"],
    ["Baud", "115200 / divisor; divisor 1 = 115200 (clock 1.8432 MHz divided by 16)"],
    ["FCR 0xC7", "enable FIFOs + clear RX + clear TX + 14-byte receive trigger"],
    ["MCR values", "0x0B normal, 0x1E loopback self-test, 0x0F after; test byte 0xAE (10101110)"],
    ["MCR bit 3 (OUT2)", "gates the UART interrupt onto IRQ4 — unused until Phase 3, set now"],
    ["Bounded spin", "SPIN_LIMIT 100000; one byte takes about 87 us on the wire at 115200"]
  ],
  code: `// kernel/arch/x86_64/io.hpp - the ONLY place that may reach I/O port space.
static inline void outb(uint16_t port, uint8_t val) {
    __asm__ volatile("outb %0, %1" : : "a"(val), "Nd"(port) : "memory");
}
static inline uint8_t inb(uint16_t port) {
    uint8_t ret;
    __asm__ volatile("inb %1, %0" : "=a"(ret) : "Nd"(port) : "memory");
    return ret;
}
// kernel/drivers/char/serial.cpp - no asm here, only calls into io.hpp.
constexpr uint16_t COM1 = 0x3F8;
constexpr uint8_t  LCR_8N1 = 0x03, LCR_DLAB = 0x80;
constexpr uint8_t  LSR_DATA_READY = 0x01, LSR_THR_EMPTY = 0x20;
constexpr uint32_t SPIN_LIMIT = 100000;
static bool g_present = false;

static bool wait_for_lsr(uint8_t mask) {          // finite: panic() calls this
    for (uint32_t i = 0; i < SPIN_LIMIT; ++i)
        if ((inb(COM1 + 5) & mask) != 0) return true;
    return false;
}
static void putc_raw(char c) {
    if (!wait_for_lsr(LSR_THR_EMPTY)) return;     // wedged UART: drop the byte
    outb(COM1 + 0, static_cast<uint8_t>(c));
}
void serial_init() {
    outb(COM1 + 1, 0x00);          // IER: mask every UART interrupt, no IDT yet
    outb(COM1 + 3, LCR_DLAB);      // LCR: DLAB on, offsets 0/1 are the divisor
    outb(COM1 + 0, 0x01);          // DLL: divisor low  -> 115200 baud
    outb(COM1 + 1, 0x00);          // DLH: divisor high
    outb(COM1 + 3, LCR_8N1);       // LCR: clears DLAB AND sets 8N1, one write
    outb(COM1 + 2, 0xC7);          // FCR: enable and clear both FIFOs
    outb(COM1 + 4, 0x0B);          // MCR: DTR | RTS | OUT2
    outb(COM1 + 4, 0x1E);          // MCR: internal loopback for the self-test
    outb(COM1 + 0, 0xAE);
    g_present = wait_for_lsr(LSR_DATA_READY) && inb(COM1 + 0) == 0xAE;
    outb(COM1 + 4, 0x0F);          // MCR: leave loopback whatever the answer
}

void serial_putc(char c) {
    if (!g_present) return;
    if (c == '\\n') putc_raw('\\r');  // LF moves down, CR moves to column 0
    putc_raw(c);
}`,
  codelang: "cpp",
  walk: [
    ["outb %0, %1 with the \"a\" and \"Nd\" constraints", "The toolchain assembles AT&T syntax, so source comes first and this reads write %0 to %1, assembling to outb %al, %dx. \"a\" pins the value in the accumulator, \"Nd\" allows an 8-bit immediate port or DX. Intel-syntax docs show the operands the other way round; getting it backwards is an assembler error, which is the one mercy in this file."],
    ["volatile and the \"memory\" clobber", "volatile stops the compiler deleting an out whose result is unused or hoisting an in out of a loop. \"memory\" is a full compiler barrier so surrounding accesses are not reordered across the port access. Omit either and it works until an inlining decision elsewhere changes."],
    ["outb(COM1 + 1, 0x00) first", "Mask every UART interrupt source before anything else. There is no IDT until Phase 2, so an IRQ arriving now finds a null gate and triple faults."],
    ["outb(COM1 + 3, LCR_DLAB) then the two divisor writes", "Setting bit 7 of LCR remaps offsets 0 and 1 from data and IER onto the divisor latch. This is the only way to reach the baud generator, and it is the single most common source of it does nothing in this stage."],
    ["outb(COM1 + 3, LCR_8N1)", "One write that clears DLAB and programs 8 data bits, 1 stop bit and no parity. Writing 0x83 here instead sets 8N1 and leaves DLAB on, which is the same bug with more confidence."],

  ],

    ["make lint", "no inline asm outside kernel/arch/  ok — serial.cpp contains no __asm__ and io.hpp is under kernel/arch/"],
    ["x86_64-elf-nm build/kernel.elf | grep serial", "serial_init, serial_putc, serial_write, serial_puts, serial_present as T; wait_for_lsr and putc_raw absent because they are in the anonymous namespace"],
